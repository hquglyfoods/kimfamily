<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6C4CE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="우리집 도장판">
<title>우리집 도장판</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="https://glifusercontent.com/i:r/rxj3rjaoi1hx433rfpcx.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
html,body{min-height:100%;margin:0}
body{font-family:'Jua',system-ui,sans-serif;background:linear-gradient(160deg,#6C4CE0,#8A5CF6 55%,#B48CFF);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:26px;text-align:center}
h1{font-size:30px;margin:0 0 10px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
p{color:#EADFFF;font-size:14.5px;margin:0}
.spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite;margin:22px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
button{margin-top:20px;background:#fff;color:#6C4CE0;font-family:'Jua';font-size:17px;
  padding:13px 26px;border:none;border-radius:15px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
</style>
<style id="touch-fx">
/* Touch feel: no grey/blue tap flash, no double-tap-zoom delay on controls, light press feedback on touch screens only. Invisible at rest. */
html{-webkit-tap-highlight-color:transparent}
a,button,input,select,textarea,label,summary,[role=button],[onclick]{touch-action:manipulation}
@media (hover:none){button:not(:disabled):active,a:active,[role=button]:active{opacity:.72}}
</style>
</head>
<body>
<h1>⭐ 우리집 도장판</h1>
<p id="msg">불러오는 중이에요…</p>
<div class="spin" id="spin"></div>
<button id="retry" style="display:none" onclick="load()">다시 시도</button>
<script>
// 앱 본체는 서버에서 받아온다. 그래서 앱을 고칠 때마다 이 파일을 다시 올릴 필요가 없다.
// 이 껍데기는 서비스 워커(sw.js)를 같은 주소에서 제공하기 위해서만 존재한다.
var SRC='https://kqnserohxtzpjolgvhrk.supabase.co/functions/v1/kimfamily2';
function fail(m){
  document.getElementById('spin').style.display='none';
  document.getElementById('msg').textContent=m;
  document.getElementById('retry').style.display='inline-block';
}
function load(){
  document.getElementById('spin').style.display='block';
  document.getElementById('retry').style.display='none';
  document.getElementById('msg').textContent='불러오는 중이에요…';
  fetch(SRC,{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(html){
      if(html.indexOf('<!DOCTYPE html>')!==0) throw new Error('bad payload');
      document.open(); document.write(html); document.close();
    })
    .catch(function(e){ fail('연결이 안 돼요. 인터넷을 확인하고 다시 눌러주세요.'); });
}
load();
</script>
</body>
</html>
