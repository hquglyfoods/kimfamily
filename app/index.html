  if(!isParent(ME))return;
  const t=STATE.tasks.find(x=>x.id===tid);if(!t)return;
  const{data:upd}=await sb.from('fam_tasks').update({status:'denied',denied_count:(t.denied_count||0)+1,updated_at:new Date().toISOString()})
    .eq('id',tid).eq('status','done').select();
  if(!upd||!upd.length){await refresh();return;}
  await notify([t.child_id],'🔄','다시 해야 해요',`${t.title} — ${ME.display_name}가 확인했는데 조금 더 필요해요!`,'task');
  toast('🔄',`${nameOf(t.child_id)}에게 다시 하기 요청`);await refresh();
});}

/* -- store -- */
async function buyItem(itemId){await guard(async()=>{
  const it=STATE.items.find(x=>x.id===itemId);if(!it)return;
  const have=bal(ME.id);
  {
    const w=activeWarns(ME.id).length, s=activeSads(ME.id).length, f=activeFines(ME.id).length;
    if(w||s||f){
      const parts=[];
      if(w)parts.push(`⚠️ 워닝 ${w}개`);
      if(s)parts.push(`😢 슬퍼요 ${s}개`);
      if(f)parts.push(`👮 벌금 ${f}개`);
      alert(`✨ 아직 살 수 없어요\n\n${it.emoji} ${it.name}\n\n지금 ${parts.join(', ')}가 있어요.\n먼저 다 지우면 살 수 있어요!\n\n· 슬퍼요는 ⭐${SAD_ERASE_COST}개로 1개씩\n· 워닝은 ⭐10개로 1개씩 지울 수 있어요`);
      return;
    }
  }
  if(have<it.cost){
    alert(`⭐ 스탬프가 모자라요\n\n${it.emoji} ${it.name}\n필요: ${it.cost}개\n지금: ${have}개\n\n${it.cost-have}개만 더 모으면 살 수 있어요!`);
    return;
  }
  if(!confirm(`${it.emoji} ${it.name}\n스탬프 ${it.cost}개로 살까요?\n\n지금 ${have}개 → 사고 나면 ${have-it.cost}개`))return;
  /* 여러 기기에서 동시에 눌러도 잔액이 마이너스가 되지 않도록 서버에서 다시 확인 */
  {
    const[{count:wc},{count:sc},{count:fc}]=await Promise.all([
      sb.from('fam_warnings').select('id',{count:'exact',head:true}).eq('child_id',ME.id).eq('status','active'),
      sb.from('fam_sads').select('id',{count:'exact',head:true}).eq('child_id',ME.id).eq('status','active'),
      sb.from('fam_fines').select('id',{count:'exact',head:true}).eq('child_id',ME.id).eq('status','active')]);
    if((wc||0)+(sc||0)+(fc||0)>0){
      alert('✨ 워닝이나 슬퍼요가 남아 있어요. 먼저 지워주세요!');
      await refresh();return;
    }
  }
  const{data:evs}=await sb.from('fam_stamp_events').select('delta').eq('child_id',ME.id);
  const freshBal=(evs||[]).reduce((s,e)=>s+e.delta,0);
  if(freshBal<it.cost){
    alert(`⭐ 스탬프가 모자라요\n\n필요: ${it.cost}개\n지금: ${freshBal}개`);
    await refresh();return;}
  await sb.from('fam_stamp_events').insert({child_id:ME.id,delta:-it.cost,kind:'purchase',reason:it.name,created_by:ME.id});
  /* 승인이 필요 없는 상품은 사자마자 바로 시작된다 */
  const auto=!!it.auto_use;
  const mins=Number(it.timer_minutes)||0;
  const row={item_id:it.id,item_name:it.name,item_emoji:it.emoji,cost:it.cost,
    child_id:ME.id,screen_hours:it.screen_hours||0};
  if(auto){
    row.status='used'; row.used_by=ME.id; row.used_at=new Date().toISOString();
    if(mins>0)row.timer_ends_at=new Date(Date.now()+mins*60000).toISOString();
  }
  const{error:tkErr}=await sb.from('fam_tickets').insert(row);
  if(tkErr){ // 티켓 발행이 실패하면 스탬프만 사라지므로 되돌려준다
    await sb.from('fam_stamp_events').insert({child_id:ME.id,delta:it.cost,kind:'adjust',reason:'구매 실패 환불: '+it.name,created_by:ME.id});
    toast('😵','구매에 실패했어요. 스탬프는 돌려놨어요.');await refresh();return;
  }
  if(auto){
    await notifyParents('🎟️',`${ME.display_name} ${it.emoji} ${it.name}`,
      mins>0?`지금부터 ${mins}분 시작 (⭐${it.cost})`:`바로 사용 (⭐${it.cost})`,'shop');
    toast(it.emoji,mins>0?`${mins}분 시작! ⭐${freshBal-it.cost}개 남았어요`:`${it.name} 시작!`);
  }else{
    await notifyParents('🎟️',`${ME.display_name} 티켓 구매 ${it.emoji} — 사용 처리 필요`,`${it.name} (⭐${it.cost})`,'shop');
    toast('🎟️',`${it.name} 구매 완료! ⭐ ${freshBal-it.cost}개 남았어요`);
  }
  await refresh();
});}
async function useTicket(tid){await guard(async()=>{
  if(!isParent(ME))return;
  const t=STATE.tickets.find(x=>x.id===tid);if(!t)return;
  /* 상품에 타이머 시간이 있으면 지금부터 시작한다 */
  const it=(STATE.allItems||STATE.items).find(x=>x.id===t.item_id);
  const mins=it?Number(it.timer_minutes)||0:0;
  const patch={status:'used',used_by:ME.id,used_at:new Date().toISOString()};
  if(mins>0)patch.timer_ends_at=new Date(Date.now()+mins*60000).toISOString();
  const{data:upd}=await sb.from('fam_tickets').update(patch)
    .eq('id',tid).eq('status','unused').select();
  if(!upd||!upd.length){await refresh();return;}
  await notify([t.child_id],'🎉',mins>0?`${t.item_emoji} ${mins}분 시작!`:'티켓을 사용했어요!',
    mins>0?`${t.item_name} — 지금부터 ${mins}분이에요`:`${t.item_emoji} ${t.item_name} — ${ME.display_name}가 사용 처리`,'shop');
  await notifyVerbose('🎉',`${nameOf(t.child_id)} 티켓 사용 ${t.item_emoji}`,`${t.item_name} · ${ME.display_name} 처리`,'shop');
  toast('🎉',`${t.item_name} 사용 처리`);await refresh();
});}

/* ============ REALTIME ============ */
/* burst of events (e.g. sticker + auto-convert + stamp) collapses into one redraw */
let SOON=null;
function refreshSoon(){
  if(SOON)clearTimeout(SOON);
  SOON=setTimeout(()=>{SOON=null;refresh();},200);
}
function subscribeRealtime(){
  const ch=sb.channel('fam-live-'+ME.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'fam_notifications',filter:`user_id=eq.${ME.id}`},payload=>{
      const n=payload.new;
      STATE.notis.unshift(n);updateBadges();
      toast(n.emoji,n.title);
      if('Notification'in window&&Notification.permission==='granted'){
        try{new Notification(n.emoji+' '+n.title,{body:n.body||''});}catch(e){}}
      refreshSoon(); // 알림이 오면 화면 수치도 즉시 갱신
    });
  ['fam_tasks','fam_tickets','fam_reports','fam_sticker_events','fam_stamp_events','fam_warnings','fam_king_warnings','fam_store_items','fam_sads','fam_missions','fam_mission_runs','fam_investments','fam_streak_days','fam_fines','fam_gold_events']
    .forEach(tbl=>ch.on('postgres_changes',{event:'*',schema:'public',table:tbl},()=>refreshSoon()));
  // 다른 기기에서 알림을 읽으면 이 기기의 뱃지도 함께 내려간다
  ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'fam_notifications',filter:`user_id=eq.${ME.id}`},
    ()=>{ if(Date.now()>SELF_READ_UNTIL)refreshSoon(); });
  ch.subscribe();
}

/* 앱이 이미 열려 있는 상태에서 알림을 누르면 서비스 워커가 이 메시지를 보낸다 */
if(typeof navigator!=='undefined'&&navigator.serviceWorker){
  navigator.serviceWorker.addEventListener('message',e=>{
    const d=e.data||{};
    if(d.type==='open-view'&&ME){
      const v=['home','task','mission','invest','shop','hist','noti'].includes(d.view)?d.view:'home';
      go(v);
    }
  });
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME)refreshSoon();});
window.addEventListener('focus',()=>{if(ME)refreshSoon();});
window.addEventListener('online',()=>{if(ME)refresh();});

boot();
</script>

<script>
const TUT_KID=[
 {s:'👋<span class="sm">⭐</span>',t:'우리집 도장판에 온 걸 환영해!',p:'착한 일을 하면 <b>⭐ 스탬프</b>를 받는 우리 가족만의 앱이야.<br>어떻게 쓰는지 금방 알려줄게!'},
 {s:'⭐',t:'스탬프를 모아봐',p:'칭찬받을 일을 하면 엄마 아빠가 스탬프를 줘.<br><b>30개를 다 모으면 💵 $10</b>로 바꿀 수 있어!',mini:true},
 {s:'📋<span class="sm">✅</span>',t:'할 일이 오면?',p:'엄마 아빠가 할 일을 보내줘.<br>다 끝내고 <b>"다 했어요!"</b> 버튼을 누르면,<br>확인 후에 <b>⭐ 스탬프 1개</b>를 받아!'},
 {s:'🛍️<span class="sm">🎟️</span>',t:'상점에서 쇼핑하기',p:'모은 스탬프로 <b>티비·게임 티켓</b>을 살 수 있어.<br>티켓은 엄마 아빠가 <b>"사용 처리"</b>를 눌러줘야 쓸 수 있어!'},
 {s:'💖',t:'언니·동생 칭찬하기',p:'자매끼리 <b>칭찬 스티커</b>를 주고받아!<br>스티커 <b>10개</b>가 모이면 자동으로 <b>⭐ 1개</b>로 변신!'},
 {s:'⚠️<span class="sm">🚨</span>',t:'워닝은 조심!',p:'약속을 안 지키거나 <b>😢 슬퍼요 5개</b>가 모이면 <b>⚠️ 워닝</b>을 받아.<br><b>3개 모이면 🚨 왕 워닝!</b> 아빠만 풀어줄 수 있어.<br>⭐ 10개로 워닝 1개를 지울 수도 있어.'},
 {s:'😢',t:'속상한 일이 있으면',p:'먼저 말로 풀어보고, 안 되면 <b>"슬퍼요 보내기"</b>!<br><b>혼자서는 줄 수 없어.</b> 다른 자매가 <b>"맞아, 나도 봤어"</b> 해야 전달돼.<br>슬퍼요 <b>5개</b>가 모이면 ⚠️ 워닝 1개!'}];
const TUT_PARENT=[
 {s:'👋<span class="sm">📊</span>',t:'관리자 화면이에요',p:'홈 <b>대시보드</b>에서 아이별 스탬프·스티커·워닝·할 일을<br>한눈에 볼 수 있어요.'},
 {s:'⭐<span class="sm">⚠️</span>',t:'스탬프 & 워닝 주기',p:'홈의 아이 이름 옆 <b>⭐ / ⚠️ 버튼</b>으로 바로 지급해요.<br>이유는 기록에 영구 저장돼요.'},
 {s:'📋',t:'할 일 보내기',p:'<b>여러 아이를 동시에 선택</b>해서 보낼 수 있어요.<br>아이가 "다 했어요!" 하면 <b>Confirm(⭐+1)</b> 또는<br><b>Denied(다시 하기)</b>로 확인해요.'},
 {s:'🎟️<span class="sm">🛒</span>',t:'티켓 & 매점 관리',p:'아이가 티켓을 사면 알림이 와요. 사용할 때 <b>"사용 처리"</b>!<br>티켓 탭에서 <b>상품 추가·가격 변경·숨김</b>도 가능해요.'},
 {s:'🚨<span class="sm">🕊️</span>',t:'왕 워닝과 아이들 이야기',p:'워닝 3개면 자동 <b>🚨 왕 워닝</b> — <b>아빠만 해제</b> 가능.<br>아이 둘이 동의한 이야기가 오면<br><b>⚠️ 워닝</b> 또는 <b>🕊️ 용서</b>를 선택해요.'}];
let tutIdx=0,tutSlides=null,tutAfter=null;
function showTutorial(after){
  document.getElementById('tut')?.remove(); // single instance only
  tutAfter=after||null;tutIdx=0;
  tutSlides=isParent(ME)?TUT_PARENT:TUT_KID;
  const el=document.createElement('div');el.id='tut';
  el.innerHTML='<div class="tcard" id="tutCard"></div><button class="tskip" onclick="endTutorial()">건너뛰기</button>';
  document.body.appendChild(el);renderTut();
}
function renderTut(){
  const s=tutSlides[tutIdx],last=tutIdx===tutSlides.length-1;
  const mini=s.mini?'<div class="mini">'+Array.from({length:6},(_,i)=>`<span class="ms${i<4?' f':''}">${i<4?'⭐':''}</span>`).join('')+'<span style="font-family:Jua;color:#B07500;font-size:14px;align-self:center">…30개=💵</span></div>':'';
  document.getElementById('tutCard').innerHTML=
    `<div class="scene">${s.s}</div><h3>${s.t}</h3><p>${s.p}</p>${mini}
     <div class="dots">${tutSlides.map((_,i)=>`<i class="${i===tutIdx?'on':''}"></i>`).join('')}</div>
     <button class="tbtn" onclick="nextTut()">${last?'🎉 시작하기!':'다음 →'}</button>`;
}
function nextTut(){if(tutIdx<tutSlides.length-1){tutIdx++;renderTut();}else endTutorial();}
function endTutorial(){localStorage.setItem('tutSeen','1');document.getElementById('tut')?.remove();if(tutAfter)tutAfter();}
function maybeShowTutorial(){
  if(!localStorage.getItem('tutSeen'))showTutorial(showNotiOnboard);
  else showNotiOnboard();
}
