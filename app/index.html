<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6C4CE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="우리집 도장판">
<title>우리집 도장판</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link rel="manifest" href="https://kqnserohxtzpjolgvhrk.supabase.co/functions/v1/kimfamily2/manifest.webmanifest" crossorigin="anonymous">
<link rel="apple-touch-icon" href="https://glifusercontent.com/i:r/rxj3rjaoi1hx433rfpcx.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F3EFFC; --card:#FFFFFF; --ink:#2B2440; --sub:#8B84A3;
  --grape:#6C4CE0; --grape-soft:#EAE4FF; --gold:#FFB63D; --gold-soft:#FFF3DC;
  --coral:#FF5D73; --coral-soft:#FFE7EB; --mint:#2EC4A6; --mint-soft:#E0F7F1;
  --navy:#3D5A80; --line:#EFEAF9; --r:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);
  max-width:520px;margin:0 auto;min-height:100dvh;position:relative;
  padding-bottom:calc(58px + env(safe-area-inset-bottom));}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}
button{font-family:inherit;border:none;cursor:pointer;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
.hide{display:none!important}
.av{border-radius:50%;object-fit:cover;display:block;box-shadow:0 2px 6px rgba(43,36,64,.18)}

/* ---------- Login ---------- */
#loginView{position:fixed;inset:0;background:linear-gradient(160deg,#6C4CE0 0%,#8A5CF6 55%,#B48CFF 100%);
  z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
#loginView h1{color:#fff;font-size:34px;letter-spacing:-.5px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
#loginView .tag{color:#E9DFFF;margin:6px 0 30px;font-size:14px}
.profileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:360px}
.profileGrid .pcard{background:rgba(255,255,255,.94);border-radius:22px;padding:18px 8px 14px;text-align:center;
  transition:transform .12s;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.pcard:active{transform:scale(.94) translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.pcard .em{font-size:40px;display:block}
.pcard .nm{font-family:'Jua';font-size:17px;margin-top:6px;display:block}
#pwPanel{width:100%;max-width:360px;background:#fff;border-radius:24px;padding:24px;margin-top:8px;box-shadow:0 10px 30px rgba(30,10,80,.35)}
#pwPanel .who{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#pwPanel .who .em{font-size:36px}
#pwPanel input{width:100%;border:2.5px solid var(--grape-soft);border-radius:14px;padding:13px 14px;outline:none}
#pwPanel input:focus{border-color:var(--grape)}
#pwErr{color:var(--coral);font-size:13px;margin-top:8px;min-height:18px}
.bigBtn{width:100%;background:var(--grape);color:#fff;font-family:'Jua';font-size:18px;padding:14px;border-radius:16px;
  box-shadow:0 5px 0 #4E35AB;margin-top:10px;transition:transform .1s}
.bigBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #4E35AB}
.ghostBtn{width:100%;color:var(--sub);font-size:14px;padding:8px;margin-top:4px}

/* ---------- App shell ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 18px 6px;display:flex;align-items:center;gap:10px}
header.top .em{font-size:32px}
header.top .who{flex:1}
header.top .who .hi{font-family:'Jua';font-size:20px}
header.top .who .sub{font-size:12px;color:var(--sub)}
#bellBtn{position:relative;font-size:24px;background:#fff;width:46px;height:46px;border-radius:16px;box-shadow:0 3px 0 var(--line)}
#bellDot{position:absolute;top:6px;right:7px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{padding:2px 18px 10px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.card h3{font-size:16.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sectionTitle{font-family:'Jua';font-size:16px;color:var(--sub);margin:18px 4px 10px}

/* ---------- Stamp punch card (signature) ---------- */
.stampBoard{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin:14px 0 6px}
.slot{aspect-ratio:1;border-radius:50%;border:2.5px dashed #D8CFF2;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#D8CFF2;background:#FBFAFF}
.slot.filled{border:none;background:radial-gradient(circle at 32% 30%,#FFD98A,#FFB63D 70%);color:#fff;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.12), 0 2px 4px rgba(255,182,61,.5);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.boardHead{display:flex;justify-content:space-between;align-items:baseline}
.boardHead .cnt{font-family:'Jua';font-size:30px;color:var(--grape)}
.boardHead .cnt small{font-size:15px;color:var(--sub)}
.goal{font-size:12.5px;color:var(--sub);text-align:center;margin-top:8px}
.goal.ready{color:#B07500;background:var(--gold-soft);border-radius:12px;padding:8px;font-weight:700}

/* ---------- Chips / badges ---------- */
.warnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.warnChip{background:var(--coral-soft);color:var(--coral);border-radius:12px;padding:7px 12px;font-size:13.5px;font-weight:700}
.kingBanner{background:linear-gradient(135deg,#A3132A,#D93B4F);color:#FFE8EB;border-radius:var(--r);padding:16px 18px;
  margin-bottom:14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 #7A0D1F}
.kingBanner .k{font-size:30px}
.kingBanner .t{font-family:'Jua';font-size:17px}
.kingBanner .d{font-size:12.5px;opacity:.85;margin-top:2px}

/* ---------- Kid rows (parent home) ---------- */
.kidRow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1.5px solid var(--line)}
.kidRow:last-child{border-bottom:none;padding-bottom:2px}
.kidRow .em{font-size:32px}
.kidRow .info{flex:1;min-width:0}
.kidRow .nm{font-family:'Jua';font-size:17px}
.kidRow .meta{font-size:12.5px;color:var(--sub);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap}
.pill{border-radius:10px;padding:2px 7px;font-weight:700;font-size:11.5px;white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:#B07500}
.pill.red{background:var(--coral-soft);color:var(--coral)}
.pill.king{background:#C4162C;color:#fff}
.pill.mint{background:var(--mint-soft);color:#118871}
.iconBtn{width:40px;height:40px;border-radius:13px;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.iconBtn.gold{background:var(--gold-soft)} .iconBtn.red{background:var(--coral-soft)} .iconBtn.blue{background:#DCE9FA}

/* ---------- Tasks ---------- */
.taskItem{border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.taskItem .tt{font-weight:700;font-size:15.5px}
.taskItem .tn{font-size:13px;color:var(--sub);margin-top:2px}
.taskItem .meta{font-size:12px;color:var(--sub);margin-top:6px}
.taskItem .row{display:flex;gap:8px;margin-top:10px}
.sBtn{flex:1;font-family:'Jua';font-size:15px;padding:10px;border-radius:12px;color:#fff;transition:transform .1s}
.sBtn:active{transform:scale(.96)}
.sBtn.mint{background:var(--mint);box-shadow:0 3px 0 #1E9078}
.sBtn.red{background:var(--coral);box-shadow:0 3px 0 #C93A50}
.sBtn.grape{background:var(--grape);box-shadow:0 3px 0 #4E35AB}
.sBtn.gray{background:#C9C3DB;box-shadow:0 3px 0 #A79FC4}
.stTag{font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 7px;vertical-align:2px;margin-left:6px}
.st-assigned{background:var(--grape-soft);color:var(--grape)}
.st-done{background:var(--gold-soft);color:#B07500}
.st-confirmed{background:var(--mint-soft);color:#118871}
.st-denied{background:var(--coral-soft);color:var(--coral)}

/* ---------- Store ---------- */
.shopItem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px solid var(--line)}
.shopItem:last-child{border-bottom:none}
.shopItem .em{font-size:32px}
.shopItem .nm{flex:1;font-weight:700;font-size:15px}
.buyBtn{background:var(--gold);color:#5A3D00;font-family:'Jua';padding:9px 14px;border-radius:12px;box-shadow:0 3px 0 #D89320;font-size:15px}
.buyBtn:disabled{background:#E6E1F2;color:#B3ACC9;box-shadow:0 3px 0 #D5CFE6}
.ticket{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--grape-soft),#fff 60%);
  border:2px dashed #C9B8FF;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.ticket.used{opacity:.55;background:#F4F2FA;border-color:#DDD6EE}
.ticket .em{font-size:28px}
.ticket .info{flex:1}
.ticket .nm{font-weight:700;font-size:14.5px}
.ticket .meta{font-size:12px;color:var(--sub)}

.sadCard{background:linear-gradient(135deg,#EDF4FF,#F7FAFF);border:2px solid #C6DAF5}
.sadRow{display:flex;gap:8px;justify-content:center;margin-top:10px}
.sadDot{width:38px;height:38px;border-radius:50%;border:2px dashed #B9CFEA;color:#B9CFEA;
  display:flex;align-items:center;justify-content:center;font-size:19px;background:#fff}
.sadDot.on{border:none;background:radial-gradient(circle at 32% 30%,#9FC2EC,#5B84C4 72%);color:#fff;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.sadChip{background:#E4EEFB;color:#3D5F94;border-radius:12px;padding:7px 12px;font-size:12.5px;font-weight:700}
.pill.blue{background:#DCE9FA;color:#3D5F94}
.dashTbl .v-sad{color:#3D5F94}
.chipGrid button{position:relative}
.spk{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
  background:rgba(255,255,255,.9);box-shadow:0 1px 3px rgba(0,0,0,.18);opacity:.9}
.spk:active{transform:scale(.9)}
.recover{margin-top:12px;border-top:1.5px dashed #C6DAF5;padding-top:11px}
.recover .rTitle{font-family:'Jua';font-size:14.5px;color:#2E7D5B;margin-bottom:7px}
.goodStrip{background:#E7F7EF;border:1.5px solid #B9E7CF;border-radius:12px;padding:9px 11px;
  font-size:12.5px;color:#1F6B4C;line-height:1.5;margin-bottom:8px}
.recover .rStep{font-size:12.5px;color:#3D5F94;line-height:1.7}
.recover .rBtns{display:flex;gap:8px;margin-top:10px}
.recover .rBtns .sBtn{flex:1;font-size:14px;padding:9px}
.shopItem.cant{opacity:.72}
.needMore{font-size:11.5px;color:#B07500;background:var(--gold-soft);border-radius:9px;
  padding:3px 8px;margin-top:4px;display:inline-block;font-weight:700}
.buyBtn:disabled{font-size:13px}
.scrCard{background:linear-gradient(135deg,#EEF3FF,#F8FAFF);border:2px solid #C9D9F5}
.scrTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.scrLabel{font-size:12.5px;color:#3D5F94}
.scrBig{font-family:'Jua';font-size:38px;color:#2F5490;line-height:1.05;margin-top:2px}
.scrBig small{font-size:16px;margin-left:3px}
.scrSide{font-size:12.5px;color:#5B84C4;text-align:right;padding-top:4px;line-height:1.5}
.scrSide b{color:#B07500}
.scrBar{height:11px;background:#E3EAF7;border-radius:6px;overflow:hidden;margin-top:10px}
.scrBar span{display:block;height:100%;background:linear-gradient(90deg,#8FB6EA,#5B84C4);border-radius:6px}
.scrItems{font-size:12px;color:#5B84C4;margin-top:7px}
.scrWait{font-size:12px;color:#8A6A00;background:var(--gold-soft);border-radius:10px;
  padding:7px 10px;margin-top:9px;line-height:1.5}
.scrDays{margin-top:12px;border-top:1.5px dashed #C9D9F5;padding-top:9px}
.scrDaysT{font-size:12px;color:#5B84C4;margin-bottom:5px}
.scrDay{display:flex;align-items:center;gap:8px;padding:2.5px 0}
.scrDName{font-size:12px;color:#5B84C4;min-width:52px}
.scrDName span{color:#9DB6DC}
.scrDBar{flex:1;height:8px;background:#E3EAF7;border-radius:4px;overflow:hidden}
.scrDBar span{display:block;height:100%;background:#9DBCE8;border-radius:4px}
.scrDVal{font-family:'Jua';font-size:12.5px;color:#5B84C4;min-width:60px;text-align:right}
.scrDVal.up{color:#B07500}
.scrDVal small{font-size:10.5px}
.mCard{background:linear-gradient(135deg,#F3EEFF,#FAF8FF);border:2px solid #D8CFF2}
.mItem{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1.5px solid var(--line)}
.mItem:last-child{border-bottom:none;padding-bottom:2px}
.mEm{font-size:30px}
.mInfo{flex:1;min-width:0}
.mName{font-weight:700;font-size:15px}
.mMeta{font-size:12px;color:var(--sub);margin-top:2px}
.mBtn{flex:0 0 auto;padding:9px 16px;font-size:14px}
.mRun{background:#fff;border:2px solid var(--grape);border-radius:16px;padding:13px;margin-bottom:12px}
.mRunTop{display:flex;align-items:center;gap:10px}
.mRunName{font-family:'Jua';font-size:16px}
.mHint{font-size:11.5px;color:var(--sub);margin-top:2px}
.mTimer{font-family:'Jua';font-size:46px;color:var(--grape);text-align:center;margin:8px 0 2px;
  font-variant-numeric:tabular-nums}
.mTimer.paused{color:#B3ACC9}
.mCtrl{display:flex;gap:8px;margin-top:8px}
.mCtrl .sBtn{flex:1;font-size:15px;padding:10px}
.needClean{font-size:11.5px;color:#B03A66;background:#FFE8F0;border-radius:9px;
  padding:3px 8px;margin-top:4px;display:inline-block;font-weight:700}
.mBlock{background:#FFF3DC;border:1.5px solid #FFD988;border-radius:14px;padding:12px;margin-bottom:12px}
.mBlockT{font-family:'Jua';font-size:14.5px;color:#8A6A00;margin-bottom:6px}
.mBlockD{font-size:12.5px;color:#8A6A00;line-height:1.6}
.invCard{background:linear-gradient(135deg,#EAF7F0,#F7FCFA);border:2px solid #B9E7CF}
.invCard.on{background:linear-gradient(135deg,#FFF6E3,#FFFDF7);border:2px solid #FFD988}
.invDesc{font-size:12.5px;color:#2E7D5B;line-height:1.6}
.invPast{font-size:12.5px;color:#B07500;background:var(--gold-soft);border-radius:10px;
  padding:7px 10px;margin-top:8px;font-weight:700}
.invStat{display:flex;gap:8px;margin-top:10px}
.invStat>div{flex:1;background:#fff;border-radius:12px;padding:9px 6px;text-align:center}
.invK{font-size:11px;color:var(--sub)}
.invV{font-family:'Jua';font-size:17px;color:var(--ink);margin-top:2px}
.invV.plus{color:#B07500}
.invSafe{font-size:12px;color:#1F6B4C;background:#E7F7EF;border-radius:10px;
  padding:7px 10px;margin-top:9px;line-height:1.5}
.invWarn{font-size:12px;color:#B03A66;background:#FFE8F0;border-radius:10px;
  padding:7px 10px;margin-top:9px;line-height:1.5}
.invBlock{font-size:12.5px;color:#8A6A00;background:#FFF3DC;border:1.5px solid #FFD988;
  border-radius:12px;padding:10px;margin-top:10px;line-height:1.6}
.invList{margin-top:10px}
.invRow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1.5px solid rgba(0,0,0,.06)}
.invRow:first-child{border-top:none}
.invRowL{flex:1;font-size:14px}
.invRowM{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;font-weight:400}
.invOut{flex:0 0 auto;padding:7px 13px;font-size:13px}
.boardDone{background:var(--gold-soft);border-radius:14px;padding:10px 12px;margin:10px 0 4px}
.bdRow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.bdChip{font-size:24px;line-height:1}
.bdMore{font-family:'Jua';font-size:15px;color:#B07500;margin-left:2px}
.bdTxt{font-size:12.5px;color:#B07500;margin-top:6px;font-weight:700}
.invHow{display:flex;gap:8px;margin-top:10px}
.ihStep{flex:1;background:#fff;border-radius:14px;padding:11px 6px;text-align:center}
.ihEm{font-size:23px;line-height:1}
.ihArrow{font-size:14px;color:var(--sub);margin:0 3px}
.ihTxt{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.4}
.ihTxt b{color:var(--ink);font-size:12.5px}
.invBig{display:flex;align-items:center;gap:12px}
.ibEm{font-size:44px;line-height:1}
.ibNum{font-family:'Jua';font-size:34px;color:#B07500;line-height:1.1}
.ibSub{font-size:12.5px;color:var(--sub)}
.invNext{background:#fff;border-radius:14px;padding:10px 12px;margin-top:11px}
.inTop{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--sub)}
.inTop b{font-family:'Jua';font-size:15px;color:var(--ink)}
.inBar{height:9px;background:#EFEAF9;border-radius:5px;overflow:hidden;margin-top:7px}
.inBar span{display:block;height:100%;background:linear-gradient(90deg,#FFD98A,#FFB63D);border-radius:5px}
.invEarn{font-size:13px;color:#B07500;background:var(--gold-soft);border-radius:12px;
  padding:8px 11px;margin-top:9px;font-weight:700}
.ipKid{border-top:1.5px solid rgba(0,0,0,.07);padding:10px 0 4px}
.ipKid:first-of-type{border-top:none}
.ipHead{display:flex;align-items:center;gap:9px}
.ipName{flex:1;font-weight:700;font-size:14.5px}
.ipSum{font-family:'Jua';font-size:13px;color:#B07500}
.ipAcct{background:#fff;border-radius:12px;padding:8px 10px;margin-top:7px}
.ipTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;color:var(--sub)}
.ipTop b{font-size:12px;color:#2E7D5B;white-space:nowrap}
.ipBar{height:7px;background:#EFEAF9;border-radius:4px;overflow:hidden;margin-top:6px}
.ipBar span{display:block;height:100%;background:linear-gradient(90deg,#FFD98A,#FFB63D);border-radius:4px}
.ipEarn{font-size:12px;color:#B07500;margin-top:7px;font-weight:700}
.stkCard{background:linear-gradient(135deg,#FFF6E3,#FFFDF7);border:2px solid #FFD988}
.stkCard.hot{background:linear-gradient(135deg,#FFEFE3,#FFF9F5);border-color:#FFB98A}
.stkTop{display:flex;align-items:center;gap:12px}
.stkEm{font-size:40px;line-height:1}
.stkNum{font-family:'Jua';font-size:32px;color:#B07500;line-height:1.1}
.stkNum small{font-size:15px;margin-left:2px}
.stkSub{font-size:12.5px;color:var(--sub)}
.stkDots{display:flex;gap:6px;justify-content:center;margin-top:11px}
.stkDot{flex:1;max-width:40px;height:34px;border-radius:10px;background:#fff;border:2px dashed #E7DCC4;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#C9BFA6;font-family:'Jua'}
.stkDot.on{border:none;background:linear-gradient(180deg,#FFD98A,#FFB63D);color:#fff;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.stkMsg{font-size:12.5px;margin-top:10px;text-align:center;line-height:1.5}
.stkMsg.ok{color:#B07500}
.stkMsg.bad{color:#B03A66}
/* 연속 성공 축하 */

/* ---------- Stamp celebration ---------- */
#celeb{position:fixed;inset:0;z-index:97;pointer-events:none;overflow:hidden;

#celeb .scrim{position:absolute;inset:0;background:rgba(24,12,50,.55);animation:cscrim 1.7s ease-out forwards}
@keyframes cscrim{0%{opacity:0}12%{opacity:1}72%{opacity:1}100%{opacity:0}}
#celeb .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,214,140,.7),rgba(255,214,140,0) 62%);
  animation:cflash 1.1s ease-out forwards}
@keyframes cflash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
#celeb .ring{position:absolute;top:45%;left:50%;width:120px;height:120px;margin:-60px 0 0 -60px;
  border:6px solid #FFC44D;border-radius:50%;animation:cring .85s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cring{0%{transform:scale(.3);opacity:.95}100%{transform:scale(3.4);opacity:0}}
#celeb .stamp{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:78px;color:#fff;background:radial-gradient(circle at 32% 28%,#FFDD95,#FFB63D 72%);
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.14), 0 14px 34px rgba(214,140,20,.5);
  animation:cstamp 1.7s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes cstamp{0%{transform:scale(2.7) rotate(-22deg);opacity:0}
  17%{transform:scale(.86) rotate(6deg);opacity:1}
  26%{transform:scale(1.1) rotate(-3deg)}
  35%{transform:scale(1) rotate(0)}
  78%{transform:scale(1) rotate(0);opacity:1}
  100%{transform:scale(1.08) rotate(0);opacity:0}}
#celeb .plus{font-family:'Jua';font-size:52px;color:#fff;margin-top:14px;
  text-shadow:0 4px 0 #C97D00, 0 0 22px rgba(255,190,80,.9);
  animation:cplus 1.7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes cplus{0%{transform:translateY(24px) scale(.5);opacity:0}
  20%{transform:translateY(0) scale(1.2);opacity:1}
  30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
#celeb .word{font-family:'Jua';font-size:24px;color:#fff;margin-top:4px;
  text-shadow:0 3px 0 rgba(0,0,0,.45);animation:cplus 1.8s ease-out forwards}
#celeb .cf{position:absolute;top:-24px;width:11px;height:15px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(112vh) rotate(760deg);opacity:.9}}
#celeb.goal .stamp{background:radial-gradient(circle at 32% 28%,#B8F5D8,#2EC4A6 72%);
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.14), 0 14px 34px rgba(20,150,120,.5)}
.setRow{display:flex;align-items:flex-start;gap:14px}
.tgl{width:54px;height:32px;border-radius:16px;background:#DDD8EC;position:relative;flex:0 0 auto;

.tgl span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .18s}
.tgl.on{background:var(--grape)}

/* ---------- Praise gift ---------- */
#gift{position:fixed;inset:0;z-index:97;pointer-events:none;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
#gift .gscrim{position:absolute;inset:0;background:rgba(60,14,44,.5);animation:gsc 2.4s ease-out forwards}
@keyframes gsc{0%{opacity:0}12%{opacity:1}74%{opacity:1}100%{opacity:0}}
#gift .glow{position:absolute;top:44%;left:50%;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,150,200,.85),rgba(255,150,200,0) 68%);
  animation:gglow 2.4s ease-out forwards}
@keyframes gglow{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1)}
  55%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.6)}}
#gift .box{font-size:104px;line-height:1;animation:gbox 2.4s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes gbox{
  0%{transform:translateY(-160px) scale(.5) rotate(-16deg);opacity:0}
  14%{transform:translateY(0) scale(1.18) rotate(0);opacity:1}
  20%{transform:translateY(0) scale(.96)}
  26%{transform:rotate(-9deg) scale(1.04)}
  32%{transform:rotate(9deg) scale(1.04)}
  38%{transform:rotate(-7deg) scale(1.06)}
  44%{transform:rotate(6deg) scale(1.06)}
  50%{transform:rotate(0) scale(1.12)}
  58%{transform:scale(1.55);opacity:1}
  66%{transform:scale(1.9);opacity:0}
  100%{transform:scale(1.9);opacity:0}}
#gift .hb{position:absolute;top:44%;left:50%;font-size:30px;opacity:0;
  animation:ghb 1.1s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:.9s}
@keyframes ghb{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}

#gift .gmsg{margin-top:16px;text-align:center;opacity:0;animation:gmsg 1.6s ease-out forwards;animation-delay:.85s}
@keyframes gmsg{0%{opacity:0;transform:translateY(14px)}18%{opacity:1;transform:none}

.heart.on{border:none;background:radial-gradient(circle at 32% 30%,#FF9DBE,#F2618F 72%);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.pill.pink{background:#FFE4EE;color:#D64578}
.chipGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.chipGrid .cl{font-family:'Jua';font-size:12.5px;margin-top:3px;display:block;color:var(--ink)}

/* ---------- Notification onboarding ---------- */

.tabs button.on{background:var(--grape);color:#fff;box-shadow:0 3px 0 #4E35AB}

<!-- LOGIN -->

<script>
const SB_URL='https://kqnserohxtzpjolgvhrk.supabase.co';
const SB_KEY='sb_publishable_6KTq8xbNOFzj1vSjYn-fWw_3MSqG0Yx';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const PUSH_FN=SB_URL+'/functions/v1/kimpush';
/* ===== 기능 스위치 (true로 바꾸면 다시 켜진다) ===== */
const INVEST_ON=true;   /* 투자 */
const STREAK_ON=false;   /* 매일 보상 */
const VAPID_PUBLIC='BG78jPzaPRbWS-MyP2_rBWwnPGtaO-0kBWSmwXyp4gVPk-QqD5VOU76jOQmTRszQI1RxhuscUIbg3nkc4BCDvrU';

const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null, USERS=[], KIDS=[], PARENTS=[], VIEW='home', STATE={balances:{},warnings:[],kings:[],tasks:[],tickets:[],notis:[],items:[],events:[],reports:[]};

async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function timeAgo(iso){const d=(Date.now()-new Date(iso))/1000;
  if(d<60)return'방금';if(d<3600)return Math.floor(d/60)+'분 전';if(d<86400)return Math.floor(d/3600)+'시간 전';
  const dt=new Date(iso);return (dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');}
function toast(emoji,msg){const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span style="font-size:20px">${emoji}</span><span>${esc(msg)}</span>`;
  $('toastWrap').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},3200);}
function isParent(u){return u.role==='dad'||u.role==='mom'||u.role==='gran';}
/* 푸시(폰 알림)를 받지 않는 사람. 앱 안 알림 탭에서는 볼 수 있다. */
function noPush(u){return !!(u&&u.settings&&u.settings.no_push);}
function avEm(u,px){ // avatar image if available, else emoji
  if(u&&u.avatar_url)return`<img class="av" src="${u.avatar_url}" style="width:${px}px;height:${px}px" alt="${esc(u.display_name)}" onerror="this.outerHTML='<span class=em style=font-size:${Math.round(px*0.82)}px>'+decodeURIComponent('${encodeURIComponent(u.emoji)}')+'</span>'">`;
  return`<span class="em" style="font-size:${Math.round(px*0.82)}px">${u?u.emoji:'🙂'}</span>`;}
let ICONS={};
function ico(key,emoji,px){ // custom icon image if available, else emoji
  if(ICONS[key])return`<img src="${ICONS[key]}" style="width:${px}px;height:${px}px;border-radius:50%;object-fit:cover;display:block" alt="">`;
  return emoji;}
function nameOf(id){const u=USERS.find(x=>x.id===id);return u?u.display_name:'?';}

/* ============ LOGIN ============ */
async function boot(){
  const{data:users,error}=await sb.from('fam_users').select('*').order('created_at');
  const{data:assets}=await sb.from('fam_assets').select('*');
  (assets||[]).forEach(a=>{ICONS[a.key]=a.url;});
  if(error){toast('📡','연결 실패. 인터넷을 확인해줘.');return;}
  // display order: dad, mom, then children oldest-first (by created_at)
  const ROLE_RANK={dad:0,mom:1,child:2};
  users.sort((a,b)=>(ROLE_RANK[a.role]??9)-(ROLE_RANK[b.role]??9)||new Date(a.created_at)-new Date(b.created_at));
  USERS=users;KIDS=users.filter(u=>u.role==='child');PARENTS=users.filter(isParent);
  const saved=localStorage.getItem('famUserId');
  if(saved){const u=USERS.find(x=>x.id===saved);if(u){enter(u);return;}}
  renderProfiles();
}
function renderProfiles(){
  $('profileGrid').innerHTML=USERS.map(u=>
    `<button class="pcard" onclick="pickProfile('${u.id}')"><span style="display:flex;justify-content:center">${avEm(u,56)}</span><span class="nm">${esc(u.display_name)}</span></button>`).join('');
}
let pickId=null;
function pickProfile(id){pickId=id;const u=USERS.find(x=>x.id===id);
  $('pwEm').innerHTML=avEm(u,44);$('pwNm').textContent=u.display_name;
  $('profileGrid').classList.add('hide');$('pwPanel').classList.remove('hide');$('pwErr').textContent='';
  $('pwInput').value='';setTimeout(()=>$('pwInput').focus(),50);}
function backToProfiles(){$('pwPanel').classList.add('hide');$('profileGrid').classList.remove('hide');}
async function doLogin(){
  const u=USERS.find(x=>x.id===pickId);
  const h=await sha256($('pwInput').value);
  if(h!==u.password_hash){$('pwErr').textContent='비밀번호가 틀렸어요 😢';return;}
  localStorage.setItem('famUserId',u.id);enter(u);
}
$('pwInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin();}});

let REFRESH_TIMER=null;
function enter(u){
  if(ME)return; // already signed in: ignore duplicate login (double-tap / Enter key)
  ME=u;$('loginView').classList.add('hide');$('appView').classList.remove('hide');
  $('meEm').innerHTML=avEm(u,36);$('meNm').textContent=u.display_name;
  $('meSub').textContent=isParent(u)
    ?(u.role==='dad'?'아빠 · 관리자 👑':u.role==='gran'?'할머니 · 관리자':'엄마 · 관리자')
    :'우리집 도장판';
  if(!isParent(u)){$('coinPill').classList.remove('hide');$('coinIco').innerHTML=ico('stamp','⭐',24);}
  $('bellIco').innerHTML=ico('bell','🔔',26);
  buildNav();initSwipe();startTicker();startTimerTick();subscribeRealtime();
  setTimeout(()=>claimStreak(),900);
  const want=viewFromHash();
  refresh().then(()=>{go(want||'home');if(want)clearHash();});
  if(REFRESH_TIMER)clearInterval(REFRESH_TIMER);
  REFRESH_TIMER=setInterval(refresh,25000);
  setTimeout(()=>maybeShowTutorial(),700);
  setupPush(); // 이미 허용된 기기는 조용히 재등록
}
function logout(){
  if(!confirm(ME.display_name+' 계정에서 로그아웃할까요?'))return;
  localStorage.removeItem('famUserId');
  location.reload();
}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function showNotiOnboard(){
  if(noPush(ME))return;   /* 푸시를 안 쓰는 사람에게는 묻지 않는다 */
  if(localStorage.getItem('notiAsked'))return;
  const hasApi='Notification'in window;
  if(hasApi&&Notification.permission!=='default'){localStorage.setItem('notiAsked','1');return;}
  const box=document.createElement('div');box.id='notiOnboard';
  if(hasApi){
    box.innerHTML=`<div class="box"><div class="big">🔔</div><h3>알림을 켜볼까요?</h3>
      <p>스탬프를 받거나, 할 일이 오거나,<br>티켓이 준비되면 바로 알려드려요!</p>
      <button class="bigBtn" onclick="enableNoti()">🔔 알림 켜기</button>
      <button class="ghostBtn" onclick="dismissNotiOnboard()">나중에 할래요</button></div>`;
  }else if(!isStandalone()){
    box.innerHTML=`<div class="box"><div class="big">📲</div><h3>앱으로 설치해요!</h3>
      <p>Safari에서 <b>공유 버튼 → 홈 화면에 추가</b>를 누르면<br>진짜 앱처럼 쓰고 알림도 받을 수 있어요!</p>
      <button class="bigBtn" onclick="dismissNotiOnboard()">알겠어요!</button></div>`;
  }else{localStorage.setItem('notiAsked','1');return;}
  document.body.appendChild(box);
}
function b64ToU8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function setupPush(){
  if(typeof navigator==='undefined'||typeof window==='undefined')return false;
  if(!('serviceWorker'in navigator)||!('PushManager'in window))return false;
  if(!('Notification'in window)||Notification.permission!=='granted')return false;
  try{
    const reg=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    await sb.from('fam_push_subs').upsert(
      {user_id:ME.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,last_ok_at:new Date().toISOString()},
      {onConflict:'endpoint'});
    return true;
  }catch(e){console.error('push setup failed',e);return false;}
}
async function enableNoti(){
  try{const p=await Notification.requestPermission();
    if(p==='granted'){
      const ok=await setupPush();
      toast('🔔',ok?'알림이 켜졌어요! 앱이 꺼져 있어도 알려줄게요':'알림이 켜졌어요!');
      render();
    }
  }catch(e){}
  dismissNotiOnboard();
}
function dismissNotiOnboard(){localStorage.setItem('notiAsked','1');$('notiOnboard')?.remove();}


/* ============ DATA ============ */
async function refresh(){
  try{ await refreshCore(); }
  catch(e){
    console.error('refresh failed',e);
    if(loadOffline()){ updateCoin();updateBadges();render(); }
    else toast('📡','연결이 안 돼요. 잠시 후 다시 시도해줘.');
  }
}
async function refreshCore(){
  const [ev,wn,kg,tk,tc,nt,it,rp,stk,sad,msn,run,inv,strk,fin,gld,allIt,balV,sbalV,tkOpen]=await Promise.all([
    sb.from('fam_stamp_events').select('*').order('created_at',{ascending:false}).limit(300),
    sb.from('fam_warnings').select('*').order('created_at',{ascending:false}),
    sb.from('fam_king_warnings').select('*').order('created_at',{ascending:false}),
    sb.from('fam_tasks').select('*').order('created_at',{ascending:false}).limit(100),
    sb.from('fam_tickets').select('*').order('purchased_at',{ascending:false}).limit(300),
    sb.from('fam_notifications').select('*').eq('user_id',ME.id).order('created_at',{ascending:false}).limit(60),
    sb.from('fam_store_items').select('*').eq('active',true).order('sort'),
    sb.from('fam_reports').select('*').order('created_at',{ascending:false}).limit(60),
    sb.from('fam_sticker_events').select('*').order('created_at',{ascending:false}).limit(300),
    sb.from('fam_sads').select('*').order('created_at',{ascending:false}).limit(300),
    sb.from('fam_missions').select('*').order('sort'),
    sb.from('fam_mission_runs').select('*').order('started_at',{ascending:false}).limit(200),
    sb.from('fam_investments').select('*').order('started_at',{ascending:false}).limit(100),
    sb.from('fam_streak_days').select('*').order('day_key',{ascending:false}).limit(60),
    sb.from('fam_fines').select('*').order('created_at',{ascending:false}).limit(200),
    sb.from('fam_gold_events').select('*').order('created_at',{ascending:false}).limit(200),
    sb.from('fam_store_items').select('*').order('sort'),
    sb.from('fam_balances').select('*'),
    sb.from('fam_sticker_balances').select('*'),
    sb.from('fam_tasks').select('*').neq('status','confirmed').order('created_at',{ascending:false}),
  ]);
  if(ev.error||balV.error) throw new Error('network');
  STATE.events=ev.data||[];STATE.warnings=wn.data||[];STATE.kings=kg.data||[];
  const seen=new Set();
  STATE.tasks=[...(tkOpen.data||[]),...(tk.data||[])].filter(x=>seen.has(x.id)?false:seen.add(x.id));STATE.tickets=tc.data||[];STATE.notis=nt.data||[];STATE.items=it.data||[];
  STATE.reports=rp.data||[];STATE.stickers=stk.data||[];STATE.sads=sad.data||[];
  STATE.missions=msn.data||[];STATE.runs=run.data||[];STATE.invests=inv.data||[];STATE.streaks=strk.data||[];STATE.fines=fin.data||[];STATE.golds=gld.data||[];STATE.allItems=allIt.data||[];
  STATE.balances={};STATE.stickerBal={};
  // 잔액은 DB가 전체 원장을 합산한 값을 쓴다.
  // (이벤트 목록은 최근 300건만 불러오므로 그것으로 합산하면 오래된 적립이 누락된다)
  const bMap=Object.fromEntries((balV.data||[]).map(r=>[r.child_id,r.balance]));
  const sMap=Object.fromEntries((sbalV.data||[]).map(r=>[r.child_id,r.balance]));
  KIDS.forEach(k=>{
    STATE.balances[k.id]=bMap[k.id]??STATE.events.filter(e=>e.child_id===k.id).reduce((s,e)=>s+e.delta,0);
    STATE.stickerBal[k.id]=sMap[k.id]??STATE.stickers.filter(e=>e.child_id===k.id).reduce((s,e)=>s+e.delta,0);
  });
  expireOldVotes();
  try{ if(INVEST_ON&&sb.rpc) sb.rpc('fam_pay_interest').then(()=>{},()=>{}); }catch(e){}
  saveOffline();OFFLINE=false;
  updateCoin();updateSticker();updateBadges();render();
}
/* ===== 오프라인 대응 =====
   마지막으로 성공한 조회 결과를 기기에 저장해 둔다.
   인터넷이 끊겨도 앱이 열리고, 최근 상태를 볼 수 있다. (쓰기는 막는다) */
let OFFLINE=false;
const OFF_KEY='famOffline';
function saveOffline(){
  try{
    localStorage.setItem(OFF_KEY,JSON.stringify({
      at:Date.now(),
      users:USERS.map(u=>({id:u.id,display_name:u.display_name,role:u.role,emoji:u.emoji,avatar_url:u.avatar_url,settings:u.settings})),
      state:{events:STATE.events,warnings:STATE.warnings,kings:STATE.kings,tasks:STATE.tasks,
        tickets:STATE.tickets,notis:STATE.notis,items:STATE.items,reports:STATE.reports,
        stickers:STATE.stickers,sads:STATE.sads,allItems:STATE.allItems,
        balances:STATE.balances,stickerBal:STATE.stickerBal}
    }));
  }catch(e){}
}
function loadOffline(){
  try{
    const raw=localStorage.getItem(OFF_KEY);if(!raw)return false;
    const d=JSON.parse(raw);if(!d||!d.state)return false;
    Object.assign(STATE,d.state);
    OFFLINE=true;OFFLINE_AT=d.at;
    return true;
  }catch(e){return false;}
}
let OFFLINE_AT=null;
function offlineBanner(){
  if(!OFFLINE)return '';
  const mins=OFFLINE_AT?Math.round((Date.now()-OFFLINE_AT)/60000):null;
  const ago=mins==null?'':(mins<1?'방금':mins<60?`${mins}분 전`:`${Math.round(mins/60)}시간 전`);
  return `<div class="card" style="background:#FFF3DC;border:2px solid #FFD988">
    <div style="font-family:'Jua';font-size:15px;color:#8A6A00">📡 인터넷이 없어요</div>
    <div style="font-size:12.5px;color:#8A6A00;margin-top:6px;line-height:1.5">
      ${ago?`${ago}`:'마지막으로'} 본 내용을 보여주고 있어요.<br>연결되면 자동으로 새로 고쳐져요.</div>
    <button class="sBtn grape" style="width:100%;margin-top:10px" onclick="refresh()">다시 시도</button></div>`;
}
function bal(id){return STATE.balances[id]||0;}
/* 스탬프를 받은 순간을 확실한 보상으로 느끼게 한다 */
const CF_COLORS=['#FFC44D','#FF8FB1','#6C4CE0','#2EC4A6','#FF5D73','#FFE066'];
function celebrate(gain,total){
  try{ celebrateInner(gain,total); }catch(e){ console.error('celebrate skipped',e); }
}
function celebrateInner(gain,total){
  document.getElementById('celeb')?.remove();
  const goal=total>=30;
  const el=document.createElement('div');
  el.id='celeb'; if(goal)el.className='goal';
  const word=goal?'🎉 30개 완성! $10 바꿀 수 있어요!'
    :(gain>=10?'우와! 대박이야!':gain>=5?'정말 잘했어!':gain>=3?'멋지다!':'잘했어!');
  el.innerHTML=`<div class="scrim"></div><div class="flash"></div><div class="ring"></div>
    <div class="stamp">${goal?'💵':'⭐'}</div>
    <div class="plus">+${gain}</div>
    <div class="word">${word}</div>`;
  const n=goal?46:Math.min(16+gain*3,40);
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='cf';
    c.style.left=Math.random()*100+'%';
    c.style.background=CF_COLORS[i%CF_COLORS.length];
    c.style.animationDuration=(1.1+Math.random()*0.9)+'s';
    c.style.animationDelay=(Math.random()*0.35)+'s';
    el.appendChild(c);
  }
  document.body.appendChild(el);
  try{ if(navigator.vibrate) navigator.vibrate(goal?[30,60,30,60,90]:[25,40,25]); }catch(e){}
  setTimeout(()=>el.remove(), goal?2800:2000);
}
/* 칭찬은 "선물이 도착한" 느낌으로. 스탬프(도장 쿵)와 다른 결로 구분한다. */
function celebratePraise(gain,from,reason,total){
  try{ praiseInner(gain,from,reason,total); }catch(e){ console.error('gift skipped',e); }
}
function praiseInner(gain,from,reason,total){

const VIEW_ORDER=INVEST_ON?['home','task','mission','invest','shop','hist','noti']
  :['home','task','mission','shop','hist','noti'];
let SW=null, SW_BUSY=false;
function swipeBlocked(){
  if(SW_BUSY)return true;
  if(document.getElementById('tut'))return true;
  if(document.getElementById('celeb'))return true;
  if(document.getElementById('notiOnboard'))return true;

function setX(px,cls){
  const m=$('main');if(!m)return;
  m.className=cls||'';

  else { m.style.transform=''; m.style.removeProperty('transform'); }

function slideTo(view,dir){
  const m=$('main');if(!m)return;
  SW_BUSY=true;
  const w=window.innerWidth||390;
  m.className='settle';
  m.style.transform=`translateX(${dir<0?-w:w}px)`;
  setTimeout(()=>{

    $('nav_'+view)?.classList.add('on');

    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      m.className='settle';

      setTimeout(()=>{m.className='';m.style.removeProperty('transform');SW_BUSY=false;
        if(view==='noti')markAllRead();},230);
    }));
  },170);
}
function neighborView(dir){
  const i=VIEW_ORDER.indexOf(VIEW);
  if(i<0)return null;
  const j=i+(dir<0?1:-1);
  return (j>=0&&j<VIEW_ORDER.length)?VIEW_ORDER[j]:null;
}
function initSwipe(){
  const m=$('main');if(!m)return;
  /* 필터 줄처럼 옆으로 스크롤되는 영역에서 시작했으면 탭 넘기기를 하지 않는다 */
  function inScroller(el){
    for(let n=el;n&&n!==m;n=n.parentElement){
      if(n.classList&&(n.classList.contains('fRow')||n.classList.contains('tkRow')||n.classList.contains('tabs')))return true;
      if(n.scrollWidth-n.clientWidth>4){
        const ov=getComputedStyle(n).overflowX;
        if(ov==='auto'||ov==='scroll')return true;
      }
    }
    return false;
  }
  m.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||swipeBlocked()){SW=null;return;}
    if(inScroller(e.target)){SW=null;return;}
    const t0=e.touches[0];
    SW={x:t0.clientX,y:t0.clientY,dx:0,axis:null,t:Date.now()};
  },{passive:true});
  m.addEventListener('touchmove',e=>{
    if(!SW||e.touches.length!==1)return;
    const t0=e.touches[0];
    const dx=t0.clientX-SW.x, dy=t0.clientY-SW.y;
    if(SW.axis===null){
      if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
      SW.axis=Math.abs(dx)>Math.abs(dy)*1.3?'x':'y';   /* 세로가 조금이라도 우세하면 스크롤에 양보 */
      if(SW.axis==='y'){SW=null;return;}
    }
    if(SW.axis!=='x')return;
    if(e.cancelable)e.preventDefault();
    const edge=!neighborView(dx<0?-1:1);
    SW.dx=edge?dx*0.28:dx;                              /* 끝 탭에서는 저항감을 준다 */
    setX(SW.dx,'swiping');
  },{passive:false});
  const finish=()=>{
    if(!SW){return;}
    const {dx,t}=SW; const cur=SW; SW=null;
    if(cur.axis!=='x'){setX(0);return;}
    const w=window.innerWidth||390;
    const speed=Math.abs(dx)/Math.max(1,Date.now()-t);   /* px/ms */
    const far=Math.abs(dx)>w*0.22, fast=speed>0.45&&Math.abs(dx)>40;
    const target=neighborView(dx<0?-1:1);
    if(target&&(far||fast)){ slideTo(target,dx<0?-1:1); }
    else { const m=$('main'); if(m){m.className='settle';m.style.transform='';
           setTimeout(()=>{m.className='';m.style.removeProperty('transform');},230);} }
  };
  m.addEventListener('touchend',finish,{passive:true});
  m.addEventListener('touchcancel',()=>{SW=null;setX(0);},{passive:true});
}

function scrollTop(){

    try{

      if(document.documentElement)document.documentElement.scrollTop=0;
      if(document.body)document.body.scrollTop=0;
    }catch(e){}
  };
  doit();
  try{ requestAnimationFrame(()=>{doit();requestAnimationFrame(doit);}); }catch(e){}
  setTimeout(doit,80); setTimeout(doit,220);
}

/* 아이가 오늘 몇 시간 쓸 수 있는지 스스로 보게 한다.
   기본 시간 + 오늘 사용 처리된 티켓만큼. */
function myScreenToday(){
  const base=baseHours(ME.id);
  const today=dayKey(Date.now());
  const used=(STATE.tickets||[]).filter(t=>t.child_id===ME.id&&t.status==='used'&&t.used_at
    &&dayKey(t.used_at)===today&&ticketHours(t)>0);
  const extra=used.reduce((s,t)=>s+ticketHours(t),0);
  /* 아직 사용 처리 전인 티켓 = 부모가 눌러주면 늘어날 시간 */
  const waiting=(STATE.tickets||[]).filter(t=>t.child_id===ME.id&&t.status==='unused'&&ticketHours(t)>0);
  const wait=waiting.reduce((s,t)=>s+ticketHours(t),0);
  return {base,extra,total:base+extra,used,wait,waiting};
}
/* 최근 7일 동안 날짜별로 쓸 수 있었던 시간 */
function myScreenDays(n){
  const base=baseHours(ME.id);
  const out=[];
  for(let i=0;i<n;i++){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);
    const key=dayKey(d);
    const used=(STATE.tickets||[]).filter(t=>t.child_id===ME.id&&t.status==='used'&&t.used_at
      &&dayKey(t.used_at)===key&&ticketHours(t)>0);
    const extra=used.reduce((s,t)=>s+ticketHours(t),0);
    out.push({d,key,base,extra,total:base+extra,used});
  }
  return out;
}
function screenCard(){
  const s=myScreenToday();

  const days=myScreenDays(7).slice(1);          /* 오늘은 위에 크게 나오므로 제외 */
  const maxT=Math.max(...myScreenDays(7).map(x=>x.total),1);
  const DN=['일','월','화','수','목','금','토'];
  return `<div class="card scrCard">
    <div class="scrTop">

    ${s.wait?`<div class="scrWait">🎟️ 아직 안 쓴 티켓 ${s.wait}시간이 있어요. 엄마 아빠가 사용 처리하면 늘어나요!</div>`:''}

      ${days.map(x=>`<div class="scrDay">

/* ===== 미션 카드 =====
   타이머는 "끝나는 시각"을 저장해 두고 남은 시간을 계산한다.
   그래서 앱을 닫거나 화면을 꺼도 시간이 흐른다 (화면을 켜둘 필요가 없다).
   시간이 다 되면 완료 대기가 되고, 부모가 확인하면 스탬프가 지급된다. */
function myRunToday(mid){
  const today=dayKey(Date.now());

    &&r.day_key===today&&r.status!=='canceled');

/* 진행 중이면 끝나는 시각까지, 멈춰 있으면 저장해 둔 남은 시간 */
function remainSec(r){
  if(r.status==='paused')return Math.max(0,r.remain_sec||0);
  return Math.max(0,Math.ceil((new Date(r.ends_at)-Date.now())/1000));
}

function mmss(s){

/* ===== 투자: "자신" 주식 =====
   ⭐5개를 넣으면 하루마다 ⭐1개씩 이자를 받는다.
   슬퍼요를 받으면 자동으로 끝나고 3개를 잃은 채 2개만 돌아온다 (서버가 처리).
   언제든 뺄 수 있고, 24시간이 지난 만큼만 이자를 받는다. */
const INVEST_COST=5, INVEST_RETURN_ON_SAD=2;
const INVEST_PERIOD_MS=259200000;   /* 72시간마다 ⭐1개 */
const INVEST_MAX=30;                /* 한 아이가 투자할 수 있는 최대 */
function myInvests(){ return (STATE.invests||[]).filter(i=>i.child_id===ME.id&&i.status==='active'); }
function myInvest(){ return myInvests()[0]; }
function investTotal(id){ return (STATE.invests||[]).filter(i=>i.child_id===id&&i.status==='active')
  .reduce((s,i)=>s+i.principal,0); }
function investUnits(i){ return Math.max(1,Math.floor(i.principal/INVEST_COST)); }
function dailyRate(id){ return Math.floor(investTotal(id)/INVEST_COST); }
function earnedTotal(id){ return (STATE.invests||[]).filter(i=>i.child_id===id)
  .reduce((s,i)=>s+(i.paid_total||0),0); }
function tsOf(v){ const t=v?new Date(v).getTime():NaN; return isNaN(t)?Date.now():t; }
function investDays(i){ return Math.max(0,Math.floor((Date.now()-tsOf(i.started_at))/86400000)); }
function nextInterestSec(i){
  const next=tsOf(i.last_paid_at)+INVEST_PERIOD_MS;
  return Math.max(0,Math.ceil((next-Date.now())/1000));
}
function hhmm(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h>0?`${h}시간`:`${m}분`;   /* 좁은 칸에 두 줄로 넘치지 않게 */
}
function hhmmLong(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h>0?`${h}시간 ${m}분`:`${m}분`;
}
async function openInvest(){
  const b=bal(ME.id);
  /* 미해결 워닝·슬퍼요·벌금이 있으면 새로 투자할 수 없다 (이미 넣은 것은 안전) */
  const bl=missionBlocked();
  if(bl){
    const parts=[];
    if(bl.w)parts.push(`⚠️ 워닝 ${bl.w}개`);
    if(bl.s)parts.push(`😢 슬퍼요 ${bl.s}개`);
    if(bl.f)parts.push(`👮 벌금 ${bl.f}개`);
    alert(`✨ 아직 투자할 수 없어요\n\n${parts.join('\n')}\n\n먼저 다 지워주세요!\n(넣어둔 ⭐는 그대로 있어요)`);
    return;
  }
  if(investTotal(ME.id)+INVEST_COST>INVEST_MAX){
    alert(`📈 투자는 ⭐${INVEST_MAX}개까지만 할 수 있어요\n\n지금 ⭐${investTotal(ME.id)} 투자 중이에요.`);
    return;
  }
  if(b<INVEST_COST){
    alert(`📈 ⭐${INVEST_COST}개가 필요해요\n\n지금: ⭐${b}\n더 필요: ⭐${INVEST_COST-b}`);
    return;
  }
  const cur=investTotal(ME.id);
  if(!confirm(`📈 ⭐${INVEST_COST}개를 투자할까요?\n\n🌙 3일마다 ⭐${dailyRate(ME.id)+1}개씩 생겨요\n📤 언제든 뺄 수 있어요\n⭐ 넣은 것은 그대로 지켜져요${cur?`\n\n지금 ⭐${cur} → ⭐${cur+INVEST_COST}`:''}`))return;
  await startInvest();
}
async function startInvest(){await guard(async()=>{
  const[{count:wc},{count:sc},{count:fc}]=await Promise.all([
    sb.from('fam_warnings').select('id',{count:'exact',head:true}).eq('child_id',ME.id).eq('status','active'),
    sb.from('fam_sads').select('id',{count:'exact',head:true}).eq('child_id',ME.id).eq('status','active'),
    sb.from('fam_fines').select('id',{count:'exact',head:true}).eq('child_id',ME.id).eq('status','active')]);
  if((wc||0)+(sc||0)+(fc||0)>0){toast('✨','😢 ⚠️ 👮 를 먼저 지워주세요');await refresh();return;}
  const{data:cur}=await sb.from('fam_investments').select('principal')
    .eq('child_id',ME.id).eq('status','active');
  const curTotal=(cur||[]).reduce((s,x)=>s+(x.principal||0),0);
  if(curTotal+INVEST_COST>INVEST_MAX){
    toast('📈',`투자는 ⭐${INVEST_MAX}개까지예요`);await refresh();return;}
  const{data:evs}=await sb.from('fam_stamp_events').select('delta').eq('child_id',ME.id);
  const fresh=(evs||[]).reduce((s,e)=>s+e.delta,0);
  if(fresh<INVEST_COST){toast('⭐','스탬프가 부족해요');await refresh();return;}
  const{data:made,error}=await sb.from('fam_investments')
    .insert({child_id:ME.id,principal:INVEST_COST,status:'active',paid_total:0,
             started_at:new Date().toISOString(),last_paid_at:new Date().toISOString()}).select();
  if(error||!made||!made.length){toast('😵','투자하지 못했어요');return;}
  const{error:payErr}=await sb.from('fam_stamp_events').insert({child_id:ME.id,delta:-INVEST_COST,
    kind:'invest',reason:'나 자신에 투자',ref_id:made[0].id,created_by:ME.id});
  if(payErr){ /* 차감이 실패하면 투자도 되돌린다 */
    await sb.from('fam_investments').delete().eq('id',made[0].id);
    toast('😵','투자하지 못했어요');await refresh();return;
  }
  const{data:act}=await sb.from('fam_investments').select('principal')
    .eq('child_id',ME.id).eq('status','active');
  const nowTotal=(act||[]).reduce((s,x)=>s+(x.principal||0),0);
  await notifyParents('📈',`${ME.display_name} 투자 ⭐${INVEST_COST}`,`지금 ⭐${nowTotal} 투자 중`,'stamp');
  toast('📈',`투자했어요! 3일마다 ⭐${Math.max(1,Math.floor(nowTotal/INVEST_COST))}개씩 생겨요`);await refresh();
});}
async function withdrawInvest(id){await guard(async()=>{
  const list=myInvests();
  const i=id?list.find(x=>x.id===id):list[0];
  if(!i)return;
  const units=investUnits(i);
  const days=Math.max(0,Math.floor((Date.now()-tsOf(i.last_paid_at))/INVEST_PERIOD_MS))*units;
  if(!confirm(`📤 ⭐${i.principal}개를 뺄까요?\n\n돌려받아요: ⭐${i.principal+days}${days>0?`\n(넣은 것 ⭐${i.principal} + 이자 ⭐${days})`:''}`))return;
  if(days>0){
    await sb.from('fam_stamp_events').insert({child_id:ME.id,delta:days,kind:'invest_interest',
      reason:`투자 이자 ${days}일치`,ref_id:i.id,created_by:ME.id});
  }
  const{data:upd}=await sb.from('fam_investments')
    .update({status:'withdrawn',closed_at:new Date().toISOString(),close_reason:'withdraw',
             returned:i.principal,paid_total:(i.paid_total||0)+days,last_paid_at:new Date().toISOString()})
    .eq('id',i.id).eq('status','active').select();
  if(!upd||!upd.length){await refresh();return;}
  await sb.from('fam_stamp_events').insert({child_id:ME.id,delta:i.principal,kind:'invest_return',
    reason:'투자 뺌 · 원금 반환',ref_id:i.id,created_by:ME.id});
  toast('📤',`⭐${i.principal+days}개를 받았어요`);await refresh();
});}

/* ===== 하루 잘 지내기 (연속 기록) =====
   슬퍼요·워닝을 하루 동안 하나도 안 받으면 다음 날 ⭐1개.
   7일 연속이면 ⭐7개를 더 받고 다시 1일째부터 시작한다. */
const STREAK_GOAL=7;
function dayKeyStr(d){
  const x=new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function myStreaks(id){ return (STATE.streaks||[]).filter(s=>s.child_id===(id||ME.id)); }
/* 오늘 기준으로 이어지는 연속 일수 (어제까지 받은 것 기준) */
function streakCount(id){
  const list=myStreaks(id);
  if(!list.length)return 0;
  const map=new Map(list.map(s=>[s.day_key,s]));
  let n=0;
  for(let i=1;i<=60;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const hit=map.get(dayKeyStr(d));
    if(!hit)break;
    n++;
    if(hit.streak_no>=STREAK_GOAL)break;   /* 7일 달성 후에는 새로 시작 */
  }
  const last=map.get(dayKeyStr(new Date(Date.now()-86400000)));
  return last?last.streak_no:0;
}
/* 오늘 아직 슬퍼요·워닝이 없는지 (오늘 진행 상황) */
function todayClean(){
  const today=dayKey(Date.now());
  const s=(STATE.sads||[]).some(x=>x.child_id===ME.id&&dayKey(x.created_at)===today);
  const w=(STATE.warnings||[]).some(x=>x.child_id===ME.id&&dayKey(x.created_at)===today);
  const f=(STATE.fines||[]).some(x=>x.child_id===ME.id&&dayKey(x.created_at)===today);
  return !s&&!w&&!f;
}

      <div class="sfDay">${big?'내일부터 다시 1일째! 또 모아봐요':`${streak}일째 · ${STREAK_GOAL-streak}일 뒤에 ⭐7개`}</div>

const WEEKEND_CAP_MIN=120;
function isWeekend(d){ const x=d?new Date(d):new Date(); const w=x.getDay(); return w===0||w===6||(w===5&&x.getHours()>=18); }

function weekendUsedMin(id){

function kidRule(id){
  const u=USERS.find(x=>x.id===(id||ME.id));
  const s=(u&&u.settings)||{};
  return { weekdayOk: !!s.weekday_ok,
           cap: Number(s.daily_cap_min)||WEEKEND_CAP_MIN };
}
function weekendBlock(it){
  if(!it||!it.weekend_only)return null;

  if(!isWeekend()&&!r.weekdayOk)return {why:'weekday'};
  const used=weekendUsedMin(ME.id), add=Number(it.timer_minutes)||60;
  if(used+add>r.cap)return {why:'cap',used,add,cap:r.cap};

/* ===== 티켓 타이머 =====
   부모가 사용 처리한 순간부터 시작. 종료 시각을 저장해 두므로 앱을 닫아도 정확하다. */
function activeTimers(id){
  return (STATE.tickets||[]).filter(t=>t.child_id===id&&t.status==='used'&&t.timer_ends_at)
    .filter(t=>t.timer_paused_at||new Date(t.timer_ends_at).getTime()>Date.now()-3600000)
    .sort((a,b)=>new Date(a.timer_ends_at)-new Date(b.timer_ends_at));
}
function timerPaused(t){ return !!t.timer_paused_at; }
function timerLeftSec(t){
  if(timerPaused(t))return Math.max(0,t.timer_remain_sec||0);
  return Math.max(0,Math.ceil((new Date(t.timer_ends_at).getTime()-Date.now())/1000));
}

async function resumeTicketTimer(id){await guard(async()=>{

  return Math.max(1,Math.round((en-st)/1000));

function mmssT(s){

/* 1초마다 남은 시간만 갱신 (화면 전체를 다시 그리지 않는다) */
let TMTICK=null, TM_RANG={};
function startTimerTick(){
  if(TMTICK)clearInterval(TMTICK);
  TMTICK=setInterval(()=>{
    if(!ME)return;
    const list=isParent(ME)
      ? (STATE.tickets||[]).filter(t=>t.status==='used'&&t.timer_ends_at
          &&new Date(t.timer_ends_at).getTime()>Date.now()-3600000)
      : activeTimers(ME.id);
    let needRender=false;
    list.forEach(t=>{
      const el=document.querySelector(`[data-left="${t.id}"]`);
      const bar=document.querySelector(`[data-bar="${t.id}"]`);
      if(!el)return;
      if(timerPaused(t))return;   /* 멈춰 있으면 숫자를 건드리지 않는다 */
      const left=timerLeftSec(t), tot=timerTotalSec(t);
      if(left>0){
        el.textContent=mmssT(left);
        if(bar)bar.style.width=Math.round(left/tot*100)+'%';
      }else{
        if(!TM_RANG[t.id]){ TM_RANG[t.id]=1; ringTimer(t); needRender=true; }
      }
    });
    if(needRender)render();
  },1000);
}
/* 시간이 다 되면 알린다: 진동 + 소리 + 화면 알림 */
function ringTimer(t){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]); }catch(e){}
  try{
    const A=window.AudioContext||window.webkitAudioContext;
    if(A){ const c=new A();
      [0,0.35,0.7].forEach(d=>{
        const o=c.createOscillator(), g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value=880; o.type='sine';
        g.gain.setValueAtTime(0.0001,c.currentTime+d);
        g.gain.exponentialRampToValueAtTime(0.3,c.currentTime+d+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d+0.3);
        o.start(c.currentTime+d); o.stop(c.currentTime+d+0.32);
      });
    }
  }catch(e){}
  try{ if(typeof Notification!=='undefined'&&Notification.permission==='granted')
    new Notification('⏰ 시간이 다 됐어요!',{body:`${t.item_emoji} ${t.item_name}`}); }catch(e){}
  toast('⏰',`${t.item_emoji} ${t.item_name} 시간이 끝났어요!`);
}

function repTag(s){const m={voting:'❓ 확인 중',agreed:'😢 슬퍼요 전달됨',dismissed:'❌ 전달 안 됨',warned:'⚠️ 워닝 줌',pardoned:'🕊️ 용서함'};

function repExplain(r){

  return{
    voting:`${W}에게 "정말 그랬어?" 물어보는 중이에요`,

}
function repItem(r,parentBtns=false){

/* 아직 안 쓴 티켓을 취소하고 스탬프를 돌려준다 (부모만) */
async function refundTicket(id){await guard(async()=>{
  if(!isParent(ME))return;
  const t=(STATE.tickets||[]).find(x=>x.id===id&&x.status==='unused');
  if(!t){toast('🎟️','이미 사용한 티켓은 취소할 수 없어요');return;}
  if(!confirm(`↩️ 티켓을 취소할까요?\n\n${t.item_emoji} ${t.item_name}\n${nameOf(t.child_id)}에게 ⭐${t.cost}개를 돌려줘요.`))return;
  const{data:del}=await sb.from('fam_tickets').delete().eq('id',id).eq('status','unused').select();
  if(!del||!del.length){await refresh();return;}
  const{error}=await sb.from('fam_stamp_events').insert({child_id:t.child_id,delta:t.cost,
    kind:'adjust',reason:`${t.item_emoji} ${t.item_name} 취소 · 환불`,created_by:ME.id});
  if(error){toast('😵','환불하지 못했어요');await refresh();return;}
  await notify([t.child_id],'↩️','티켓이 취소됐어요',
    `${t.item_emoji} ${t.item_name} · ⭐${t.cost}개를 돌려받았어요`,'shop');
  toast('↩️',`${nameOf(t.child_id)}에게 ⭐${t.cost}개 환불`);await refresh();
});}
function ticketHtml(t,parentBtn=false){
  return`<div class="ticket ${t.status}"><span class="em">${t.item_emoji}</span>
    <div class="info"><div class="nm">${esc(t.item_name)}</div>
    <div class="meta">${USERS.find(u=>u.id===t.child_id)?.emoji||''} ${esc(nameOf(t.child_id))} · ${timeAgo(t.purchased_at)}${t.status==='used'?` · ${esc(nameOf(t.used_by))}가 사용 처리`:''}</div></div>

      <button class="sBtn gray" style="flex:0 0 auto;padding:9px 11px;font-size:13px;margin-left:6px" onclick="refundTicket('${t.id}')">↩️ 취소</button>`:

/* ===== 화면시간 추적 =====
   기본 하루 3시간에, 아이가 쓴 티켓만큼 시간이 늘어난다.
   "그날 실제 허용 시간이 얼마였는지"를 날짜별로 보여준다. */
const BASE_SCREEN_HOURS=3;   /* 설정 전 기본값 */
function baseHours(kid){
  const u=USERS.find(x=>x.id===kid);
  const v=u&&u.settings&&u.settings.base_hours;
  return (v===0||v)?Number(v):BASE_SCREEN_HOURS;
}
let tkKid='all', tkItem='all';
function ticketHours(t){
  if(t.screen_hours!=null)return Number(t.screen_hours)||0;
  const it=(STATE.allItems||STATE.items).find(i=>i.id===t.item_id);
  return it?Number(it.screen_hours)||0:0;
}
function screenReport(){
  /* 사용 처리된 티켓만 실제로 시간을 쓴 것으로 본다 */
  const used=(STATE.tickets||[]).filter(t=>t.status==='used'&&t.used_at&&ticketHours(t)>0);
  const kids=tkKid==='all'?KIDS:KIDS.filter(k=>k.id===tkKid);
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);
    const key=dayKey(d);
    const rows=kids.map(k=>{
      const mine=used.filter(t=>t.child_id===k.id&&dayKey(t.used_at)===key);
      const extra=mine.reduce((s,t)=>s+ticketHours(t),0);
      return {k,extra,items:mine};
    }).filter(r=>tkKid!=='all'||r.extra>0);
    days.push({d,key,rows});
  }
  const DN=['일','월','화','수','목','금','토'];
  const bases=[...new Set(KIDS.map(k=>baseHours(k.id)))];
  let h=`<div class="card"><h3>📱 화면시간 <span class="pill gold">기본 ${bases.length===1?bases[0]+'시간':'아이별'}</span></h3>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="flex:1;font-size:12.5px;color:var(--sub)">사용 처리한 티켓만큼 그날 시간이 늘어나요.</div>
      <button class="fBtn" style="flex:0 0 auto;padding:6px 11px;font-size:12.5px" onclick="openScreenSettings()">⚙️ 기본시간</button>
      <button class="fBtn" style="flex:0 0 auto;padding:6px 11px;font-size:12.5px" onclick="copyScreenReport()">📋 복사</button>
    </div>`;
  let any=false;
  days.forEach(({d,rows})=>{
    const isToday=dayKey(d)===dayKey(Date.now());
    if(!rows.length&&!isToday)return;
    any=true;
    h+=`<div class="sDay"><div class="sDate${isToday?' now':''}">${isToday?'오늘':`${d.getMonth()+1}/${d.getDate()} (${DN[d.getDay()]})`}</div>`;
    if(!rows.length){h+=`<div class="sNone">추가 없음 · 기본 시간만</div>`;}
    rows.forEach(({k,extra,items})=>{
      const total=baseHours(k.id)+extra;
      h+=`<div class="sRow">${avEm(k,24)}
        <div class="sName">${esc(k.display_name)}</div>
        <div class="sBar"><span style="width:${Math.min(100,total/8*100)}%"></span></div>
        <div class="sVal${extra?' up':''}">${total}시간${extra?` <small>(+${extra})</small>`:''}</div></div>`;
      if(extra&&items.length)h+=`<div class="sItems">${items.map(t=>`${t.item_emoji} ${esc(t.item_name)}`).join(' · ')}</div>`;
    });
    h+=`</div>`;
  });
  if(!any)h+=`<div class="empty" style="padding:14px 0"><span class="e">📱</span>아직 사용한 티켓이 없어요</div>`;
  h+=`</div>`;
  return h;
}
function ticketFilters(){
  const items=[...new Map((STATE.tickets||[]).map(t=>[t.item_name,t.item_emoji])).entries()];
  let h=`<div class="tkF"><div class="tkRow">
    <button class="fBtn${tkKid==='all'?' on':''}" onclick="tkKid='all';render()">전체</button>
    ${KIDS.map(k=>`<button class="fBtn${tkKid===k.id?' on':''}" onclick="tkKid='${k.id}';render()">${k.emoji} ${esc(k.display_name)}</button>`).join('')}
  </div>`;
  if(items.length>1)h+=`<div class="tkRow">
    <button class="fBtn${tkItem==='all'?' on':''}" onclick="tkItem='all';render()">전체</button>
    ${items.map(([nm,em])=>`<button class="fBtn${tkItem===nm?' on':''}" onclick="tkItem='${esc(nm).replace(/'/g,"\\'")}';render()">${em}</button>`).join('')}
  </div>`;
  h+=`</div>`;

function filterTickets(list){
  return list.filter(t=>(tkKid==='all'||t.child_id===tkKid)&&(tkItem==='all'||t.item_name===tkItem));
}
/* 아이마다 하루 기본 화면시간을 다르게 줄 수 있다 */
function openScreenSettings(){
  openSheet(`<h3>⚙️ 하루 기본 화면시간</h3>
    <div style="font-size:12.5px;color:var(--sub);line-height:1.5;margin-bottom:14px">
      티켓으로 추가되기 전, 아이가 원래 쓸 수 있는 시간이에요.<br>0.5 단위로 넣을 수 있어요.</div>
    ${KIDS.map(k=>`<div class="field">
      <label>${k.emoji} ${esc(k.display_name)}</label>
      <input id="bh_${k.id}" type="number" min="0" max="24" step="0.5" inputmode="decimal" value="${baseHours(k.id)}">
    </div>`).join('')}
    <button class="bigBtn" onclick="saveScreenSettings()">저장</button>`);
}
async function saveScreenSettings(){await guard(async()=>{
  if(!isParent(ME))return;
  for(const k of KIDS){
    const v=Math.max(0,Math.min(24,Number($('bh_'+k.id).value)||0));
    if(v===baseHours(k.id))continue;
    const settings=Object.assign({},k.settings||{},{base_hours:v});
    const{error}=await sb.from('fam_users').update({settings}).eq('id',k.id);
    if(error){toast('😵','저장하지 못했어요');return;}
    k.settings=settings;
    const u=USERS.find(x=>x.id===k.id); if(u)u.settings=settings;
  }
  closeSheet();toast('⚙️','기본 화면시간을 저장했어요');render();
});}
/* 아이폰 스크린타임과 비교하기 쉽게 표로 복사한다 */
function copyScreenReport(){
  const used=(STATE.tickets||[]).filter(t=>t.status==='used'&&t.used_at&&ticketHours(t)>0);
  const kids=tkKid==='all'?KIDS:KIDS.filter(k=>k.id===tkKid);
  const lines=['날짜\t아이\t기본\t추가\t허용합계\t티켓'];
  for(let i=0;i<7;i++){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);
    const key=dayKey(d);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    kids.forEach(k=>{
      const mine=used.filter(t=>t.child_id===k.id&&dayKey(t.used_at)===key);
      const extra=mine.reduce((s,t)=>s+ticketHours(t),0);
      const base=baseHours(k.id);
      lines.push(`${ds}\t${k.display_name}\t${base}\t${extra}\t${base+extra}\t${mine.map(t=>t.item_name).join('; ')}`);
    });
  }
  const text=lines.join('\n');
  const done=()=>toast('📋','복사했어요. 메모나 엑셀에 붙여넣으면 돼요');
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));}
    else fallbackCopy(text,done);
  }catch(e){fallbackCopy(text,done);}
}
function fallbackCopy(text,done){
  try{
    const ta=document.createElement('textarea');ta.value=text;
    ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);
    ta.select();ta.setSelectionRange(0,text.length);
    document.execCommand('copy');ta.remove();done();
  }catch(e){toast('😵','복사하지 못했어요');}
}

function parentShop(){
  let h='';
  const pend=STATE.tickets.filter(t=>t.status==='unused').length;
  h+=`<div class="tabs">
    <button class="${shopTab==='tickets'?'on':''}" onclick="setShopTab('tickets')">🎟️ 티켓${pend?` (${pend})`:''}</button>
    <button class="${shopTab==='screen'?'on':''}" onclick="setShopTab('screen')">📱 화면시간</button>
    <button class="${shopTab==='store'?'on':''}" onclick="setShopTab('store')">🛒 매점</button>
  </div>`;
  if(shopTab==='screen'){ h+=ticketFilters(); h+=screenReport(); return h; }
  if(shopTab==='store'){ h+=storeManage(); return h; }
  h+=ticketFilters();
  const un=filterTickets(STATE.tickets.filter(t=>t.status==='unused'));
  const us=filterTickets(STATE.tickets.filter(t=>t.status==='used')).slice(0,40);
  const running=(STATE.tickets||[]).filter(t=>t.status==='used'&&t.timer_ends_at
    &&(t.timer_paused_at||new Date(t.timer_ends_at).getTime()>Date.now()));
  if(running.length){
    h+=`<div class="card tmCard"><h3>⏳ 지금 쓰는 중 <span class="pill blue">${running.length}</span></h3>`;
    running.sort((a,b)=>new Date(a.timer_ends_at)-new Date(b.timer_ends_at)).forEach(t=>{
      const left=timerLeftSec(t), tot=timerTotalSec(t);
      const pz=timerPaused(t);
      h+=`<div class="tmRow${pz?' paused':''}">
        <div class="tmTop"><span class="tmEm">${t.item_emoji}</span>
          <div class="tmName">${esc(nameOf(t.child_id))} · ${esc(t.item_name)}${pz?' <span class="pill" style="background:#EFEDF6;color:#7B7396">멈춤</span>':''}</div>
          <div class="tmLeft" data-left="${t.id}">${mmssT(left)}</div></div>
        <div class="tmBar"><span data-bar="${t.id}" style="width:${Math.round(left/tot*100)}%"></span></div>
        <button class="sBtn ${pz?'mint':'gray'}" style="width:100%;margin-top:8px;padding:8px;font-size:13.5px"
          onclick="${pz?`resumeTicketTimer('${t.id}')`:`pauseTicketTimer('${t.id}')`}">${pz?'▶️ 다시 시작':'⏸️ 잠깐 멈춤'}</button>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="sectionTitle">사용 처리 기다리는 티켓 ${un.length?`<span class="pill red">${un.length}</span>`:''}</div>`;
  h+=un.length?un.map(t=>ticketHtml(t,true)).join(''):`<div class="empty"><span class="e">🎫</span>기다리는 티켓이 없어요</div>`;
  h+=`<div class="sectionTitle">사용된 티켓 기록 ${us.length?`<span class="pill gold">${us.length}</span>`:''}</div>`;
  h+=us.length?us.map(t=>ticketHtml(t)).join(''):`<div class="empty"><span class="e">🎫</span>기록이 없어요</div>`;
  return h;
}

async function saveItemPrice(id){await guard(async()=>{
  if(!isParent(ME))return;
  const cost=parseInt($('eiCost').value,10);
  if(!cost||cost<1){toast('⭐','가격은 1개 이상이어야 해요');return;}
  const hrs=Math.max(0,Number($('eiHours').value)||0);
  const cleanReq=$('eiClean')?$('eiClean').classList.contains('on'):false;
  closeSheet();
  const it=(STATE.allItems||STATE.items).find(x=>x.id===id);
  const tmin=Math.max(0,parseInt(($('eiTimer')||{}).value,10)||0);
  const autoU=$('eiAuto')?$('eiAuto').classList.contains('on'):false;

async function toggleItem(id){await guard(async()=>{
  if(!isParent(ME))return;
  const it=(STATE.allItems||STATE.items).find(x=>x.id===id);if(!it)return;
  await sb.from('fam_store_items').update({active:!it.active}).eq('id',id);
  toast(it.active?'🙈':'👀',it.active?`${it.name} 숨김 (기록은 유지)`:`${it.name} 다시 판매`);
  await refresh();
});}

/* ---- history ---- */
/* 기록을 한 줄로 합칠 때 쓰는 "얼마 뒤" 표현 */
function gapText(from,to){
  const s=(new Date(to)-new Date(from))/1000;
  if(s<60)return Math.max(1,Math.round(s))+'초 뒤';
  if(s<3600)return Math.round(s/60)+'분 뒤';
  if(s<86400)return Math.round(s/3600)+'시간 뒤';
  return Math.round(s/86400)+'일 뒤';
}
let histKid=null,histFilter='all';
function histView(){
  const kids=isParent(ME)?KIDS:[ME];
  if(!histKid||!kids.find(k=>k.id===histKid))histKid=kids[0].id;
  let h='';
  if(kids.length>1)h+=`<div class="tabs">${kids.map(k=>`<button class="${histKid===k.id?'on':''}" onclick="setHistKid('${k.id}')">${k.emoji} ${esc(k.display_name)}</button>`).join('')}</div>`;
  const rows=[];
  STATE.events.filter(e=>e.child_id===histKid).forEach(e=>{
    const kindMap={give:'⭐,칭찬 스탬프',task:'📋,할 일 완료',purchase:'🎟️,상점 구매',warning_erase:'🧽,스탬프로 워닝 지움',sad_erase:'🧽,스탬프로 슬퍼요 지움',fine_erase:'👮,벌금 지움',invest:'📈,투자',gold_buy:'🏅,골드 스탬프 구매',send:'🎁,보냄',receive:'🎁,받음',streak:'🌟,하루 잘 지냄',streak_bonus:'🏆,7일 연속 보너스',invest_interest:'💰,투자 이자',invest_return:'📤,투자 반환',invest_loss:'📉,투자 손실',adjust:'✏️,조정',sticker:'🌟,칭찬 스티커 10개 달성'};
    const[em,label]=(kindMap[e.kind]||'⭐,스탬프').split(',');
    rows.push({g:'stamp',t:e.created_at,em,main:`${label}${e.reason?' · '+esc(e.reason):''}`,sub:`${esc(nameOf(e.created_by))}`,amt:(e.delta>0?'+':'')+e.delta,cls:e.delta>0?'plus':'minus'});
  });
  /* 골드 스탬프 사용: 스탬프가 안 움직이므로 따로 기록에 넣는다 */
  (STATE.golds||[]).filter(g=>g.child_id===histKid&&g.kind==='spend').forEach(g=>{
    rows.push({g:'gold',t:g.created_at,em:'🏅',
      main:`골드 스탬프로 바꿈${g.reason?' · '+esc(g.reason):''}`,
      sub:'⭐ 스탬프 없이 받음',amt:'🏅-1',cls:'minus'});
  });
  STATE.warnings.filter(w=>w.child_id===histKid).forEach(w=>{
    let sub=`${esc(nameOf(w.created_by))}가 줌`, em='⚠️', amt='⚠️';
    if(w.resolved_at){
      const m={parent:'부모가 용서',stamps:'스탬프 10개로 지움',king:'🚨 왕 워닝으로 전환'};
      const who=w.resolved_by?esc(nameOf(w.resolved_by))+' · ':'';
      sub+=` → ${gapText(w.created_at,w.resolved_at)} ${who}${m[w.resolved_method]||'해결'}`;
      em=w.status==='escalated'?'🚨':'🧹'; amt='';
    }
    rows.push({g:'warn',t:w.created_at,em,main:`워닝 · ${esc(w.reason||'')}`,sub,amt,cls:'warn'});
  });
  (STATE.sads||[]).filter(s=>s.child_id===histKid).forEach(s=>{
    let sub=`${esc(nameOf(s.created_by))}가 보냄`, em='😢', amt='😢';
    if(s.resolved_at){
      const m={parent:'부모가 용서',stamps:`스탬프 ${SAD_ERASE_COST}개로 지움`,warning:`⚠️ ${SAD_TO_WARN}개 모여 워닝으로 전환`};
      const who=s.resolved_by?esc(nameOf(s.resolved_by))+' · ':'';
      sub+=` → ${gapText(s.created_at,s.resolved_at)} ${who}${m[s.resolved_method]||'해결'}`;
      em=s.status==='escalated'?'⚠️':'🧹'; amt='';
    }
    rows.push({g:'sad',t:s.created_at,em,main:`슬퍼요 · ${esc(s.reason||'')}`,sub,amt,cls:'minus'});
  });
  (STATE.stickers||[]).filter(e=>e.child_id===histKid&&e.kind==='praise').forEach(e=>{
    rows.push({g:'praise',t:e.created_at,em:'💖',main:`칭찬 스티커${e.reason?' · '+esc(e.reason):''}`,sub:`${esc(nameOf(e.created_by))}가 줌`,amt:'+1',cls:'plus'});
  });
  (STATE.reports||[]).filter(r=>r.reporter_id===histKid||r.target_id===histKid).forEach(r=>{
    const roleTxt=r.reporter_id===histKid?`${esc(nameOf(r.target_id))} 이야기 보냄`:`${esc(nameOf(r.reporter_id))}가 이야기 보냄`;
    const stTxt={voting:'투표 중',agreed:'부모 전달',dismissed:'의견 다름',warned:'워닝 결정',pardoned:'용서'}[r.status];
    rows.push({g:'report',t:r.created_at,em:'🕊️',main:`이야기 · ${roleTxt} (${stTxt})`,sub:`"${esc((r.reason||'').slice(0,40))}"`,amt:'',cls:'minus'});
  });
  STATE.kings.filter(k=>k.child_id===histKid).forEach(k=>{
    let sub='아빠에게 알림', em='🚨', amt='🚨';
    if(k.cleared_at){
      sub+=` → ${gapText(k.created_at,k.cleared_at)} ${esc(nameOf(k.cleared_by))}가 해제`;
      em='🕊️'; amt='';
    }
    rows.push({g:'warn',t:k.created_at,em,main:'왕 워닝 발생 (워닝 3개 누적)',sub,amt,cls:'warn'});
  });
  rows.sort((a,b)=>new Date(b.t)-new Date(a.t));

  /* 최근 7일 스탬프 흐름 (하루에 얼마나 모았는지 한눈에) */
  const days=[],today=new Date();today.setHours(0,0,0,0);
  for(let i=6;i>=0;i--){
    const d=new Date(today.getTime()-i*86400000);
    const got=STATE.events.filter(e=>e.child_id===histKid&&e.delta>0&&dayKey(e.created_at)===dayKey(d))
      .reduce((s,e)=>s+e.delta,0);
    days.push({d,got});
  }
  const maxG=Math.max(1,...days.map(x=>x.got));
  const week=days.reduce((s,x)=>s+x.got,0);
  const DN=['일','월','화','수','목','금','토'];
  h+=`<div class="card"><h3>📈 최근 7일 <span class="pill gold">⭐ +${week}</span></h3>
    <div class="chart">${days.map(x=>`<div class="col">
      <div class="barWrap"><div class="bar${x.got?'':' zero'}" style="height:${x.got?Math.max(8,x.got/maxG*100):3}%">${x.got?`<span>${x.got}</span>`:''}</div></div>
      <div class="dl${dayKey(x.d)===dayKey(Date.now())?' now':''}">${DN[x.d.getDay()]}</div></div>`).join('')}</div></div>`;

  /* 종류별 보기 */
  const FILTERS=[['all','전체'],['stamp','⭐'],['gold','🏅'],['warn','⚠️'],['sad','😢'],['praise','💖'],['report','🕊️']];
  h+=`<div class="fRow" id="fRow">${FILTERS.map(([k,l])=>`<button class="fBtn${histFilter===k?' on':''}" onclick="setHistFilter('${k}')">${l}</button>`).join('')}</div>`;
  const shown=histFilter==='all'?rows:rows.filter(r=>r.g===histFilter);
  h+=`<div class="card">${shown.length?shown.slice(0,80).map(r=>`<div class="histItem"><span class="em">${r.em}</span>
    <div class="info"><div>${r.main}</div><div class="meta">${timeAgo(r.t)} · ${r.sub}</div></div>
    <span class="amt ${r.cls}">${r.amt}</span></div>`).join(''):`<div class="empty"><span class="e">📖</span>${histFilter==='all'?'아직 기록이 없어요':'이 종류의 기록이 없어요'}</div>`}</div>`;
  return h;
}

/* ---- notifications ---- */
let notiFilter='all';
function setNotiFilter(k){ notiFilter=k; render(); scrollTop(); }
function notiView(){
  if(!STATE.notis.length)return`<div class="empty"><span class="e">🔔</span>알림이 없어요</div>`;
  /* 종류별로 나눠 본다. 개수가 0인 종류는 버튼을 만들지 않는다. */
  const GROUPS=[['stamp','⭐'],['task','📋'],['shop','🎟️'],['praise','💖'],
                ['sad','😢'],['warn','⚠️'],['report','🕊️']];
  const cnt=k=>STATE.notis.filter(n=>k==='all'?true:(n.kind||'info')===k).length;
  const avail=GROUPS.filter(([k])=>cnt(k)>0);
  let h=`<div class="fRow">
    <button class="fBtn${notiFilter==='all'?' on':''}" onclick="setNotiFilter('all')">전체 ${STATE.notis.length}</button>
    ${avail.map(([k,em])=>`<button class="fBtn${notiFilter===k?' on':''}" onclick="setNotiFilter('${k}')">${em} ${cnt(k)}</button>`).join('')}
  </div>`;
  const list=notiFilter==='all'?STATE.notis:STATE.notis.filter(n=>(n.kind||'info')===notiFilter);
  if(!list.length)return h+`<div class="empty"><span class="e">🔔</span>이 종류의 알림이 없어요</div>`;
  h+=`<div class="card">${list.map(n=>`<div class="notiItem ${n.read?'':'unread'}">
    <span class="em">${n.emoji}</span><div><div class="tt">${esc(n.title)}</div>
    ${n.body?`<div class="bd">${esc(n.body)}</div>`:''}<div class="tm">${timeAgo(n.created_at)}</div></div></div>`).join('')}</div>`;
  return h;
}

/* action lock: prevents double-tap duplicates */
let BUSY=false;
async function guard(fn){
  if(BUSY)return;
  if(OFFLINE){toast('📡','인터넷이 연결되면 할 수 있어요');return;}
  BUSY=true;try{await fn();}catch(e){console.error(e);toast('😵','문제가 생겼어요. 다시 시도해줘.');}finally{BUSY=false;}}
async function giveStamp(){await guard(async()=>{
  if(!isParent(ME))return;   /* 스탬프 발행은 부모만 */
  if(!gsKids.length){toast('👧','누구에게 줄지 골라줘');return;}
  const reason=$('gsReason').value.trim();closeSheet();
  await sb.from('fam_stamp_events').insert(
    gsKids.map(kid=>({child_id:kid,delta:gsCnt,kind:'give',reason,created_by:ME.id})));
  for(const kid of gsKids)
    await notify([kid],'⭐',`${ME.display_name} → 나 ⭐${gsCnt}개!`,reason||'잘했어요!','stamp');
  await notifyVerbose('⭐',`${ME.display_name} → ${gsKids.map(nameOf).join(', ')} ⭐${gsCnt}`,`${reason||'칭찬'}`,'stamp');
  toast('⭐',gsKids.length>1?`${gsKids.length}명에게 스탬프 ${gsCnt}개씩!`:`${nameOf(gsKids[0])}에게 스탬프 ${gsCnt}개!`);
  await refresh();
});}

async function warnCore(kidId,reason,opts){

  // 신고 결과로 주는 워닝은 호출한 쪽에서 더 자세히 알리므로 여기서는 생략한다
  if(!(opts&&opts.silentChild)){
    await notify([kidId],'⚠️',`${ME.display_name} → 나 워닝`,`${reason||''} — 3개가 모이면 아빠에게 알림이 가요!`,'warn');
    await notifyVerbose('⚠️',`${ME.display_name} → ${nameOf(kidId)} 워닝`,`${reason||''}`,'warn');
  }
  // escalation check (claim the 3 warnings first so only one king is ever created)
  const{data:act}=await sb.from('fam_warnings').select('id').eq('child_id',kidId).eq('status','active').order('created_at',{ascending:true});
  if(act&&act.length>=3){

    const{data:claimed}=await sb.from('fam_warnings').update({status:'escalated',resolved_at:new Date().toISOString(),resolved_method:'king'})
      .in('id',ids).eq('status','active').select();
    if(claimed&&claimed.length===3){
      await sb.from('fam_king_warnings').insert({child_id:kidId,warning_ids:ids});
      await notify([...PARENTS.map(p=>p.id),kidId],'🚨',`${nameOf(kidId)} 왕 워닝 발생!`,'워닝 3개가 모였어요. 아빠만 해제할 수 있어요.','king');
      toast('🚨',`${nameOf(kidId)} 왕 워닝 발생! 아빠에게 알림`);
    }
  }
}

/* -- undo: cancel a stamp or warning issued by mistake (30 min window) -- */
const UNDO_MS=1800000;
function recentUndoables(){
  const cut=Date.now()-UNDO_MS,out=[];
  (STATE.events||[]).forEach(e=>{
    if(e.kind==='give'&&new Date(e.created_at).getTime()>cut)
      out.push({kind:'stamp',id:e.id,child:e.child_id,at:e.created_at,by:e.created_by,
                label:`⭐ 스탬프 ${e.delta}개`,reason:e.reason});
  });
  (STATE.warnings||[]).forEach(w=>{
    if(w.status==='active'&&new Date(w.created_at).getTime()>cut)
      out.push({kind:'warn',id:w.id,child:w.child_id,at:w.created_at,by:w.created_by,
                label:'⚠️ 워닝',reason:w.reason});
  });
  (STATE.sads||[]).forEach(s=>{
    if(s.status==='active'&&new Date(s.created_at).getTime()>cut&&s.created_by===ME.id)
      out.push({kind:'sad',id:s.id,child:s.child_id,at:s.created_at,by:s.created_by,
                label:'😢 슬퍼요',reason:s.reason});
  });
  return out.sort((a,b)=>new Date(b.at)-new Date(a.at));
}
async function undoStamp(id){await guard(async()=>{
  if(!isParent(ME))return;

  const{data:evs}=await sb.from('fam_stamp_events').select('delta').eq('child_id',e.child_id);

});}

async function forgiveAll(kind){await guard(async()=>{
  if(!isParent(ME))return;
  const isSad=kind==='sad';
  const list=isSad?(STATE.sads||[]).filter(s=>s.status==='active')
                  :(STATE.warnings||[]).filter(w=>w.status==='active');
  if(!list.length)return;
  if(!confirm(`${isSad?'슬퍼요':'워닝'} ${list.length}개를 모두 용서할까요?`))return;
  const table=isSad?'fam_sads':'fam_warnings';
  const{data:upd}=await sb.from(table)
    .update({status:'erased',resolved_by:ME.id,resolved_at:new Date().toISOString(),resolved_method:'parent'})
    .in('id',list.map(x=>x.id)).eq('status','active').select();
  const done=(upd||[]).length;
  if(!done){await refresh();return;}
  const kids=[...new Set((upd||[]).map(x=>x.child_id))];
  for(const kid of kids){
    const n=(upd||[]).filter(x=>x.child_id===kid).length;
    await notify([kid],'🕊️',`${isSad?'슬퍼요':'워닝'}가 용서됐어요`,
      `${ME.display_name}가 ${n}개를 모두 지워줬어요 😊 새로 시작하자!`,isSad?'sad':'warn');
  }
  toast('🕊️',`${done}개 모두 용서했어요`);await refresh();
});}

async function eraseWarnWithStamps(){await guard(async()=>{

  const{data:upd}=await sb.from('fam_warnings').update({status:'erased',resolved_by:ME.id,resolved_at:new Date().toISOString(),resolved_method:'stamps'})
    .eq('id',w.id).eq('status','active').select();
  if(!upd||!upd.length){await refresh();return;}
  const{error:payErr2}=await sb.from('fam_stamp_events').insert({child_id:ME.id,delta:-10,kind:'warning_erase',reason:'워닝 지우기',ref_id:w.id,created_by:ME.id});

  }
  await notifyParents('🧽',`${ME.display_name}가 스탬프 10개로 워닝을 지웠어요`,w.reason||'','warn');

});}
